/* DeskDot casino — the phone page for casino tables (docs/CASINO.md §5). One self-contained file: phones on the
   LAN may be offline, so no CDNs, no fonts, no crypto.subtle (plain http) — SHA-256 lives below.
   Screens: join → seat (name, colour, avatar) → table. Games plug in through registerGame() (see the script). */
:root{
  /* the theme (status.table_theme.css, set by applyTheme; these are classic): accent = --gold*, felt, page surfaces */
  --gold:#ffcc33;--gold2:#e2a400;--gold-hi:#ffe08a;--gold-deep:#3a2c08;--gold-ink:#1a1200;--gold-rgb:255,204,51;--gold-text:#ffcc33;
  --felt:#0d6b45;--felt2:#0a5236;--felt3:#063823;--felt-ink:#e7f0ec;
  --bg:#060c0a;--s1:#0f1a17;--s2:#172722;--s3:#1c352b;--s4:#2a4139;
  /* the felt's motif (css.pattern / pattern_size: pure CSS gradients, one size per layer; set for every theme) */
  --pat:none;--pat-size:auto;
  /* derived once from the theme — use these, never a literal accent */
  --accent-soft:rgba(var(--gold-rgb),.14);--glow:rgba(var(--gold-rgb),.35);--well:color-mix(in srgb,var(--bg) 70%,#000);
  --veil:color-mix(in srgb,var(--bg) 94%,transparent);--toastbg:color-mix(in srgb,var(--s2) 96%,transparent);
  /* semantic colours (outcomes, warnings, roulette pockets): never themed */
  --red:#e0283c;--redd:#9e1426;--blk:#22222b;--warn:#ff7419;
  --line:rgba(255,255,255,.14);--line2:rgba(255,255,255,.24);
  --ink:#f3efe4;--dim:#b6b0a2;--mute:#9e9a8c;--ok:#4dff8a;--bad:#ff4d6a;
  --c:#ffcc33;--ca:rgba(255,204,51,.35);
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
  --disp:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --st:env(safe-area-inset-top,0px);--sr:env(safe-area-inset-right,0px);--sb:env(safe-area-inset-bottom,0px);--sl:env(safe-area-inset-left,0px);
  --ease:cubic-bezier(.2,.8,.2,1);
  color-scheme:dark;
}
/* table themes (status.table_theme, apps/_casino.py TABLE_THEMES): the felt and accent cross-fade */

/* ---------- join ---------- */

@keyframes flip{0%,70%,100%{filter:none}35%{filter:brightness(1.35) drop-shadow(0 0 14px var(--gold))}}

.sh-b{overflow-y:auto;padding:0 calc(var(--sr) + 16px) calc(var(--sb) + 16px) calc(var(--sl) + 16px);touch-action:pan-y;-webkit-overflow-scrolling:touch}
/* how to play / rulebook / payouts (casino/rulebook.py, sent once in hello) */
.hb{width:44px;height:46px;border-radius:14px;border:1px solid var(--line2);background:var(--s2);display:grid;place-items:center;font:900 20px/1 var(--disp);color:var(--gold-text)}
.htabs{position:sticky;top:0;z-index:2;display:flex;gap:4px;padding:4px;margin:0 0 10px;border-radius:14px;background:var(--s3);border:1px solid rgba(var(--gold-rgb),.16)}
.htabs button{flex:1;min-height:44px;border-radius:10px;font:800 13px/1.1 var(--disp);color:var(--dim)}
.htabs button[aria-selected=true]{background:linear-gradient(180deg,var(--gold-hi),var(--gold));color:var(--gold-ink)}
.tagl{margin:2px 0 12px;color:var(--dim);font-size:14px}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;counter-reset:st}
.steps li{position:relative;padding:10px 12px 10px 48px;border-radius:14px;background:var(--s3);border:1px solid var(--line);font-size:14.5px;line-height:1.4;counter-increment:st}
.steps li::before{content:counter(st);position:absolute;left:10px;top:9px;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;
  background:radial-gradient(circle at 50% 35%,var(--felt),var(--felt3));border:2px solid var(--gold);color:var(--gold-text);font:900 14px/1 var(--mono)}
.rb h3{margin:16px 0 6px;font:850 12px/1.2 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--gold-text)}
.rb ul{margin:0;padding:0 0 0 18px;display:flex;flex-direction:column;gap:6px;font-size:14px;line-height:1.45;color:var(--ink)}
.rb li::marker{color:var(--gold)}
.steps b,.rb b{color:var(--gold-text);font-weight:800}
.howto{position:absolute;inset:0;z-index:80;display:grid;place-items:end center;padding:16px calc(var(--sr) + 12px) calc(var(--sb) + 16px) calc(var(--sl) + 12px);background:rgba(0,0,0,.6);animation:fade .2s}
.howto .card{width:100%;max-width:440px;max-height:calc(100% - var(--st) - 16px);overflow-y:auto;padding:18px 16px 16px;border-radius:22px;
  background:radial-gradient(120% 70% at 50% 0%,var(--felt2),var(--s1) 70%);border:1px solid rgba(var(--gold-rgb),.45);box-shadow:0 20px 70px rgba(0,0,0,.7);animation:up .3s var(--ease)}
.howto h2{margin:0 0 2px;font:900 22px/1.15 var(--disp)}
.howto .eng{color:var(--gold-text)}
.howto .bt{display:flex;gap:8px;margin-top:14px}.howto .bt button{flex:1}
.row{display:grid;grid-template-columns:28px 38px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.row .rk{font:900 15px/1 var(--mono);color:var(--mute);text-align:center}
.row .av{width:38px;height:38px;border-radius:9px;background:var(--well)}
.row b{display:block;font:850 14px/1.15 var(--mono);text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row small{color:var(--mute);font-size:12px}
.row .cr{text-align:right;font:900 16px/1.1 var(--mono);color:var(--gold-text)}
.row .cr small{display:block;font:700 11px/1 var(--mono)}
.pos{color:var(--ok)!important}.neg{color:#ff8a9c!important}
.row.me{background:linear-gradient(90deg,rgba(var(--gold-rgb),.08),transparent)}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 12px;font-size:13px;margin:10px 0}
.kv dt{color:var(--mute);font:800 10.5px/1.6 var(--mono);letter-spacing:.12em;text-transform:uppercase}
.kv dd{margin:0;font:600 12px/1.5 var(--mono);word-break:break-all;user-select:text;-webkit-user-select:text}
.vr{display:flex;align-items:center;gap:10px;padding:10px 12px;margin:8px 0;border-radius:12px;background:var(--s3);font-weight:750}
.vr.ok{background:rgba(77,255,138,.12);color:var(--ok)}.vr.bad{background:rgba(255,77,106,.14);color:var(--bad)}
.rounds{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 4px}
.rounds button{min-width:44px;height:36px;padding:0 8px;border-radius:10px;font:850 13px/1 var(--mono);color:#fff;opacity:.8}
.rounds button[aria-pressed=true]{opacity:1;box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--gold)}
.pill{min-height:44px;padding:0 16px;border-radius:12px;background:var(--s3);border:1px solid rgba(var(--gold-rgb),.25);font-weight:800}
.pill.hot{background:linear-gradient(180deg,var(--gold-hi),var(--gold));color:var(--gold-ink);border-color:transparent}
.note{color:var(--mute);font-size:12.5px;margin:6px 0}
.pays{width:100%;border-collapse:collapse;font-size:13.5px}
.pays td{padding:7px 0;border-bottom:1px solid var(--line)}.pays td:last-child{text-align:right;font:800 13px/1 var(--mono);color:var(--gold-text)}
.end{position:absolute;inset:0;z-index:90;display:grid;place-items:center;padding:24px;background:var(--veil)}
.endcard{max-width:340px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.endcard h2{margin:0;font:900 26px/1.1 var(--disp)}.endcard p{margin:0;color:var(--dim)}
.paused{position:absolute;left:50%;top:50%;z-index:20;transform:translate(-50%,-50%);padding:12px 22px;border-radius:14px;background:rgba(0,0,0,.8);border:1px solid var(--gold);color:var(--gold-text);font:900 18px/1 var(--mono);letter-spacing:.2em;pointer-events:none}

/* ---------- chip flights, drag & drop, who is on a spot, the tour ---------- */
html,body,.board,.dock{touch-action:manipulation}
.rack{touch-action:none}
.fx{position:fixed;inset:0;z-index:65;pointer-events:none;overflow:hidden}
.fly{position:absolute;left:0;top:0;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;will-change:transform,opacity;display:grid;place-items:center;
  background:repeating-conic-gradient(var(--cc) 0 22deg,#fff 0 32deg,var(--cc) 0 45deg);box-shadow:0 4px 0 rgba(0,0,0,.45),0 8px 16px rgba(0,0,0,.4)}
.fly::before{content:"";position:absolute;inset:5px;border-radius:50%;background:var(--cc);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.6)}
.fly b{position:relative;font:900 11px/1 var(--mono);color:var(--ct,#fff);letter-spacing:-.03em}
.fly.ghost{width:52px;height:52px;margin:-26px 0 0 -26px;box-shadow:0 16px 0 rgba(0,0,0,.28),0 0 0 3px var(--gold),0 0 30px rgba(var(--gold-rgb),.55)}
.fly.ghost b{font-size:13px}
.fly.ghost.rm{box-shadow:0 16px 0 rgba(0,0,0,.28),0 0 0 3px var(--bad),0 0 30px rgba(255,77,106,.5)}
.fly.ghost.rm::after{content:"\2715";position:absolute;right:-6px;top:-6px;width:20px;height:20px;border-radius:50%;background:var(--bad);color:#fff;font:900 12px/20px var(--disp);text-align:center}
.dd-on{outline:3px solid var(--gold);outline-offset:-3px;filter:brightness(1.18)}
[data-spot].mine{touch-action:none}
.wd{display:inline-flex;align-items:center;gap:2px;padding:2px 5px 2px 3px;border-radius:999px;background:rgba(0,0,0,.62);border:1px solid rgba(255,255,255,.25);
  font:800 10px/1 var(--mono);color:#eee;white-space:nowrap;pointer-events:none;vertical-align:middle}
.wd i{width:8px;height:8px;border-radius:50%;background:var(--pc,#888);box-shadow:0 0 0 1px rgba(0,0,0,.6);flex:none}
.wd i.me{box-shadow:0 0 0 1.5px #fff}
.wd em{font-style:normal;margin-left:2px}
.snd svg{width:20px;height:20px}
.snd.off{color:var(--mute)}
/* the tour: a spotlight on one control, a card with Back / Next / Skip */
.tour{position:fixed;inset:0;z-index:95;touch-action:none}
.tour-hole{position:absolute;left:0;top:0;width:10px;height:10px;border-radius:16px;border:2px solid var(--gold);box-shadow:0 0 0 200vmax color-mix(in srgb,var(--bg) 76%,transparent),0 0 26px rgba(var(--gold-rgb),.5);
  transition:transform .32s var(--ease),width .32s var(--ease),height .32s var(--ease);pointer-events:none}
.tour-card{position:absolute;left:12px;right:12px;top:40%;max-width:420px;margin:0 auto;padding:14px 14px 12px;border-radius:18px;
  background:radial-gradient(120% 80% at 50% 0,var(--felt2),var(--s1) 75%);border:1px solid rgba(var(--gold-rgb),.5);box-shadow:0 18px 50px rgba(0,0,0,.7);transition:top .3s var(--ease)}
.tour-card .eng{color:var(--gold-text)}
.tour-card h3{margin:4px 0 4px;font:900 19px/1.15 var(--disp)}
.tour-card p{margin:0;color:var(--ink);font-size:14.5px;line-height:1.4}
.tour-card p b{color:var(--gold-text)}
.tour-bt{display:flex;gap:8px;align-items:center;margin-top:12px}
.tour-dots{flex:1;display:flex;gap:4px;justify-content:center}
.tour-dots i{width:6px;height:6px;border-radius:3px;background:rgba(255,255,255,.25);transition:width .2s}
.tour-dots i.on{background:var(--gold);width:16px}
.tz{display:flex;gap:6px;justify-content:flex-end;margin:-4px 0 8px}
.tz button{min-width:44px;min-height:36px;border-radius:10px;background:var(--s3);border:1px solid rgba(var(--gold-rgb),.25);font:850 13px/1 var(--disp)}
.tz .tour-go{margin-right:auto;padding:0 12px;background:linear-gradient(180deg,var(--gold-hi),var(--gold));color:var(--gold-ink);border-color:transparent}
.rbz{zoom:var(--tzoom,1)}

/* ================= roulette ================= */
.rt{position:absolute;inset:0;touch-action:none}
.rt .cell{position:absolute;display:grid;place-items:center;border:1px solid rgba(255,255,255,.28);font:900 15px/1 var(--mono);color:#fff;
  transition:background-color .15s,box-shadow .15s,opacity .2s}
.rt .felt{position:absolute;border-radius:14px;background:var(--pat),radial-gradient(120% 80% at 50% 30%,var(--felt),var(--felt2) 70%,var(--felt3));background-size:var(--pat-size),100% 100%;box-shadow:inset 0 0 0 2px rgba(var(--gold-rgb),.35),inset 0 0 30px rgba(0,0,0,.45),0 10px 30px rgba(0,0,0,.5)}
.rt .n-red{background:linear-gradient(180deg,#e8344a,#b51a2f)}.rt .n-black{background:linear-gradient(180deg,#2c2c35,#16161c)}
.rt .n-green{background:linear-gradient(180deg,#15a95e,#0b7a42)}
.rt .out{font:850 12.5px/1.1 var(--disp);letter-spacing:.04em;text-transform:uppercase;text-align:center;color:var(--felt-ink)}
.rt .rail{background:rgba(0,0,0,.28);border-color:rgba(var(--gold-rgb),.22)}
.rt .dia{width:26px;height:26px;transform:rotate(45deg);border-radius:4px;box-shadow:0 0 0 2px rgba(255,255,255,.5)}
.rt .hl{box-shadow:inset 0 0 0 3px var(--gold),inset 0 0 26px rgba(var(--gold-rgb),.55)!important;z-index:2}
.rt .won{animation:won .5s ease-in-out infinite alternate;z-index:3}
@keyframes won{to{box-shadow:inset 0 0 0 4px #fff,0 0 26px 6px var(--gold)}}
.rt .chp{position:absolute;z-index:5;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;pointer-events:none;display:grid;place-items:center;
  background:repeating-conic-gradient(var(--cc) 0 22deg,#fff 0 32deg,var(--cc) 0 45deg);box-shadow:0 3px 0 rgba(0,0,0,.5),0 0 0 1.5px rgba(0,0,0,.4)}
.rt .chp::before{content:"";position:absolute;inset:4px;border-radius:50%;background:var(--cc);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.6)}
.rt .chp b{position:relative;font:900 10.5px/1 var(--mono);color:var(--ct,#fff);letter-spacing:-.03em}
.rt .chp.win{box-shadow:0 0 0 3px var(--gold),0 0 22px var(--gold)}
.rt .oth{position:absolute;z-index:4;margin:-9px 0 0 -9px;min-width:18px;height:18px;padding:0 4px;border-radius:9px;pointer-events:none;
  background:rgba(0,0,0,.65);border:1px solid rgba(255,255,255,.35);font:800 9.5px/16px var(--mono);color:#ddd;text-align:center}
@keyframes place{from{transform:translateY(-14px) scale(1.3);opacity:0}}
.rt .tip{position:absolute;z-index:8;pointer-events:none;padding:6px 10px;border-radius:10px;background:var(--veil);border:1px solid var(--gold);
  font:800 13px/1.2 var(--disp);white-space:nowrap;transform:translate(-50%,-100%);margin-top:-30px;box-shadow:0 8px 20px rgba(0,0,0,.5)}
.rt .tip small{color:var(--gold-text);font:800 12px/1 var(--mono);margin-left:6px}
.rt .last{font:800 11px/1 var(--mono);color:var(--dim);gap:6px;display:flex;align-items:center;justify-content:center;border:0}
.rt .last i{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font:900 13px/1 var(--mono);font-style:normal;color:#fff;box-shadow:0 0 0 2px rgba(255,255,255,.3)}

/* ================= 7 up 7 down ================= */
.sv{position:absolute;inset:0;display:flex;flex-direction:column;gap:10px;padding-bottom:4px}
.tray{flex:none;height:min(28vh,150px);border-radius:18px;display:flex;align-items:center;justify-content:center;gap:18px;position:relative;
  background:var(--pat),radial-gradient(120% 90% at 50% 20%,var(--felt),var(--felt2) 70%,var(--felt3));background-size:var(--pat-size),100% 100%;box-shadow:inset 0 0 0 2px rgba(var(--gold-rgb),.3),inset 0 0 30px rgba(0,0,0,.5)}
.die{width:min(18vh,84px);aspect-ratio:1;border-radius:20%;background:linear-gradient(145deg,#ff5a66,#c0182c 55%,#8a0c1c);box-shadow:inset 0 -5px 0 rgba(0,0,0,.25),0 10px 18px rgba(0,0,0,.45);
  display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:14%;gap:4%}
.die i{border-radius:50%;background:#fff;box-shadow:inset 0 -2px 0 rgba(0,0,0,.18);opacity:0}
.die i.on{opacity:1}
.tray.rolling .die{animation:tumble .32s linear infinite}
.tray.rolling .die:nth-child(2){animation-duration:.27s;animation-direction:reverse}
@keyframes tumble{0%{transform:rotate(0) translateY(0)}25%{transform:rotate(90deg) translateY(-10px)}50%{transform:rotate(180deg)}75%{transform:rotate(270deg) translateY(-6px)}100%{transform:rotate(360deg)}}
.tray .sum{position:absolute;right:14px;top:10px;font:900 30px/1 var(--mono);text-shadow:0 2px 0 rgba(0,0,0,.4)}
.tray .wait{position:absolute;inset:auto 0 10px;text-align:center;color:var(--felt-ink);opacity:.8;font-size:13px}
.zones{flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.zone{position:relative;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:10px 4px;
  background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(0,0,0,.25)),var(--zc);box-shadow:inset 0 0 0 2px rgba(255,255,255,.18),0 8px 20px rgba(0,0,0,.4);
  transition:transform .12s var(--ease),box-shadow .2s,filter .2s}
.zone:active{transform:scale(.97)}
.zone .zi{font:900 clamp(30px,10vw,52px)/1 var(--mono)}
.zone .zl{font:900 13px/1.1 var(--disp);letter-spacing:.08em;text-transform:uppercase;text-align:center}
.zone .zs{font:700 11px/1 var(--mono);opacity:.75}
.zone .zp{font:900 14px/1 var(--mono);padding:5px 9px;border-radius:999px;background:rgba(0,0,0,.35)}
.zone .zb{min-height:30px;display:flex;align-items:center;gap:6px}
.zone .zb .chp{position:relative;margin:0;animation:none}
.zone .zo{font:700 11px/1 var(--mono);opacity:.7;min-height:12px}
.zone.won{box-shadow:inset 0 0 0 3px #fff,0 0 40px var(--zc);animation:pulse 1s ease-in-out infinite}
.zone.lost{filter:brightness(.45) saturate(.6)}
.z-down{--zc:#1b5bd8}.z-seven{--zc:#c58b00}.z-up{--zc:#c81f43}
.sv .chp{position:relative;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:repeating-conic-gradient(var(--cc) 0 22deg,#fff 0 32deg,var(--cc) 0 45deg);box-shadow:0 3px 0 rgba(0,0,0,.5)}
.sv .chp::before{content:"";position:absolute;inset:5px;border-radius:50%;background:var(--cc);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.6)}
.sv .chp b{position:relative;font:900 10.5px/1 var(--mono);color:var(--ct,#fff)}
.generic{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:var(--dim);padding:20px}

/* ===== BEGIN cards & wheels block (holdem · teenpatti · andarbahar · bigsix) — shared helpers prefixed .pc- ===== */
.pc{--cw:46px;position:relative;flex:none;width:var(--cw);aspect-ratio:5/7;border-radius:calc(var(--cw)*.13);background:linear-gradient(180deg,#fffdf6,#ebe5d6);
  box-shadow:0 4px 10px rgba(0,0,0,.45),inset 0 0 0 1px rgba(0,0,0,.12);color:#16161c;display:grid;place-items:center;font:900 calc(var(--cw)*.42)/1 var(--mono);transition:transform .35s var(--ease)}
.pc.red{color:#d21c34}
.pc b{position:absolute;left:12%;top:7%;font-size:calc(var(--cw)*.36);line-height:1}
.pc i{font-style:normal;font-size:calc(var(--cw)*.5);margin-top:22%}
.pc.back{background:repeating-linear-gradient(45deg,#b31227 0 5px,#8c0d1f 5px 10px);box-shadow:0 4px 10px rgba(0,0,0,.45),inset 0 0 0 3px var(--gold2)}
.pc.empty{background:rgba(255,255,255,.04);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.14)}
.pc.hi{box-shadow:0 0 0 3px var(--gold),0 0 22px rgba(var(--gold-rgb),.6)}
.pc.dim{filter:brightness(.55) saturate(.6)}
.pc.flip{animation:pcflip .45s var(--ease)}
@keyframes pcflip{0%{transform:rotateY(90deg)}100%{transform:none}}
.pv{position:absolute;inset:0;display:flex;flex-direction:column;gap:8px;overflow-y:auto;overscroll-behavior:contain;padding-bottom:calc(var(--sb) + 10px);touch-action:pan-y}
.pv>*{flex-shrink:0}
.pv-seats{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 4px;flex:none;scrollbar-width:none}
.pv-seat{flex:none;min-width:70px;padding:6px 8px;border-radius:12px;background:var(--s2);border:1.5px solid var(--line);font:700 11px/1.25 var(--mono);position:relative}
.pv-seat b{display:block;font:850 12px/1.2 var(--mono);text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:84px}
.pv-seat.turn{border-color:var(--gold);box-shadow:0 0 16px rgba(var(--gold-rgb),.35)}
.pv-seat.out{opacity:.4}
.pv-seat.me{background:linear-gradient(180deg,rgba(var(--gold-rgb),.12),var(--s2))}
.pv-seat .tag{position:absolute;right:-4px;top:-6px;min-width:18px;height:18px;padding:0 4px;border-radius:9px;background:#fff;color:#111;font:900 10px/18px var(--mono);text-align:center}
.pv-seat .tag.ai{background:var(--red);color:#fff}.pv-seat .tag.sn{background:#28d8ff}.pv-seat .tag.bl{background:#8a8aa0;color:#fff}
.pv-seat small{display:block;color:var(--dim)}
.pv-felt{flex:none;border-radius:20px;padding:12px 10px;display:flex;flex-direction:column;align-items:center;gap:8px;
  background:var(--pat),radial-gradient(120% 90% at 50% 20%,var(--felt),var(--felt2) 70%,var(--felt3));background-size:var(--pat-size),100% 100%;box-shadow:inset 0 0 0 2px rgba(var(--gold-rgb),.3),inset 0 0 30px rgba(0,0,0,.5)}
.pv-row{display:flex;gap:6px;justify-content:center}
.pv-pot{font:900 22px/1 var(--mono);color:var(--gold-hi);text-shadow:0 2px 0 rgba(0,0,0,.4)}
.pv-pot small{font:800 11px/1 var(--mono);color:var(--felt-ink);letter-spacing:.12em;margin-right:6px;opacity:.8}
.pv-sub{font:700 12px/1.3 var(--mono);color:var(--felt-ink);opacity:.85;text-align:center}
.pv-hand{flex:none;display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:18px;background:var(--s2);border:1px solid var(--line)}
.pv-hand .pc{--cw:min(19vw,78px)}
.pv-hand .nm{flex:1;min-width:0}
.pv-hand .nm b{display:block;font:900 17px/1.2 var(--disp)}
.pv-hand .nm small{color:var(--dim);font-size:12.5px}
.pv-act{flex:none;display:grid;gap:8px}
.pv-btns{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.pv-btn{min-height:56px;border-radius:16px;border:1px solid rgba(var(--gold-rgb),.22);background:var(--s3);font:900 15px/1.1 var(--disp);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.pv-btn small{font:800 12px/1 var(--mono);opacity:.85}
.pv-btn:active{transform:translateY(2px)}
.pv-btn:disabled{opacity:.3}
.pv-btn.fold{background:#3a1d24;border-color:rgba(255,77,106,.4);color:#ffb3c0}
.pv-btn.call{background:#123a5a;border-color:rgba(70,170,255,.5);color:#bfe2ff}
.pv-btn.raise{background:linear-gradient(180deg,var(--gold-hi),var(--gold));color:var(--gold-ink);border-color:transparent;box-shadow:0 4px 0 var(--gold-deep)}
.pv-btn.show{background:#3d2a5c;border-color:rgba(190,90,255,.5);color:#e6ccff}
.pv-btn.see{background:#0e4a55;border-color:rgba(40,216,255,.5);color:#bff3ff}
.pv-slide{display:grid;gap:8px;padding:10px;border-radius:16px;background:var(--s2);border:1px solid var(--line)}
.pv-slide .pv-btn{flex-direction:row;gap:6px}
.pv-slide input{width:100%;accent-color:var(--gold);height:34px}
.pv-pre{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.pv-pre button{min-height:38px;border-radius:10px;background:var(--s3);border:1px solid rgba(var(--gold-rgb),.22);font:800 12.5px/1 var(--mono)}
.pv-amt{display:flex;align-items:baseline;justify-content:space-between;font:900 22px/1 var(--mono);color:var(--gold-text)}
.pv-amt small{font:700 12px/1 var(--mono);color:var(--dim)}
.pv-wait{flex:none;text-align:center;color:var(--dim);padding:10px;border-radius:14px;background:rgba(255,255,255,.03);border:1px dashed var(--line2);font-weight:700}
.pv-timer{height:5px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden}
.pv-timer i{display:block;height:100%;background:var(--gold);transition:width .25s linear}
.pv-timer.hurry i{background:var(--red)}
.pv-sit{min-height:52px;border-radius:16px;font:900 16px/1 var(--disp)}
.pv-res{display:grid;gap:6px}
.pv-res .r{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:12px;background:var(--s2)}
.pv-res .r .pc{--cw:30px}
.pv-res .r b{flex:1;min-width:0;font:850 13px/1.2 var(--mono);text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pv-res .r.rw{background:linear-gradient(90deg,rgba(var(--gold-rgb),.18),var(--s2));box-shadow:inset 0 0 0 1.5px rgba(var(--gold-rgb),.5)}
.pv-ask{flex:none;padding:12px;border-radius:16px;background:linear-gradient(180deg,rgba(var(--gold-rgb),.16),var(--s2));border:1.5px solid var(--gold);display:grid;gap:8px;text-align:center;font-weight:800}
.pv-ask .pv-btns{grid-template-columns:1fr 1fr}
/* bet zones for the house games */
.hz{position:absolute;inset:0;display:flex;flex-direction:column;gap:8px;overflow-y:auto;padding-bottom:4px;touch-action:pan-y}
.hz-top{flex:none;display:flex;align-items:center;justify-content:center;gap:12px;min-height:84px;border-radius:18px;padding:8px;
  background:var(--pat),radial-gradient(120% 90% at 50% 20%,var(--felt),var(--felt2) 70%,var(--felt3));background-size:var(--pat-size),100% 100%;box-shadow:inset 0 0 0 2px rgba(var(--gold-rgb),.3)}
.hz-top .pc{--cw:44px}
.hz-top .lbl{font:800 12px/1.3 var(--mono);color:var(--felt-ink);text-align:center}
.hz-grid{display:grid;gap:8px}
.hz-z{position:relative;min-height:74px;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:8px 4px;
  background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(0,0,0,.25)),var(--zc);box-shadow:inset 0 0 0 2px rgba(255,255,255,.18),0 6px 16px rgba(0,0,0,.35);transition:transform .12s,filter .2s}
.hz-z:active{transform:scale(.97)}
.hz-z .n{font:900 24px/1 var(--mono);text-shadow:0 2px 0 rgba(0,0,0,.35)}
.hz-z .l{font:900 12px/1.1 var(--disp);letter-spacing:.06em;text-transform:uppercase}
.hz-z .p{font:900 12.5px/1 var(--mono);padding:4px 8px;border-radius:999px;background:rgba(0,0,0,.35)}
.hz-z .m{min-height:16px;font:800 12px/1 var(--mono)}
.hz-z .o{font:700 10.5px/1 var(--mono);opacity:.75;min-height:11px}
.hz-z.won{box-shadow:inset 0 0 0 3px #fff,0 0 34px var(--zc);animation:pulse 1s ease-in-out infinite}
.hz-z.lost{filter:brightness(.45) saturate(.6)}
.hz .chp{position:relative;display:inline-grid;vertical-align:middle;width:24px;height:24px;border-radius:50%;place-items:center;background:repeating-conic-gradient(var(--cc) 0 22deg,#fff 0 32deg,var(--cc) 0 45deg);box-shadow:0 2px 0 rgba(0,0,0,.5)}
.hz .chp::before{content:"";position:absolute;inset:4px;border-radius:50%;background:var(--cc)}
.hz .chp b{position:relative;font:900 9.5px/1 var(--mono);color:var(--ct,#fff)}
.hz-h{font:800 10.5px/1 var(--mono);letter-spacing:.16em;color:var(--mute);text-transform:uppercase;margin:4px 2px 0}
.t-gold{background:#a87a00}.t-andar{background:#1b5bd8}.t-bahar{background:#c81f53}
.t-b6_1{background:#c99a00;color:#1a1200!important}.t-b6_2{background:#1e5fd8}.t-b6_5{background:#0b9a52}.t-b6_10{background:#8a3ad6}.t-b6_20{background:#d8521a}.t-b6_joker{background:#c8237a}.t-b6_logo{background:#a08a3a}
/* ===== END cards & wheels block ===== */
/* ===== BEGIN house games block (blackjack · baccarat · slots) — helpers prefixed .hg-, .bj-, .bc-, .sl- ===== */
.t-gold{background:#c99400;color:#1a1200!important}.t-player{background:#1f5fe0}.t-banker{background:#c81f3a}.t-tie{background:#0f9a52}
.hg-chp{position:relative;flex:none;width:30px;height:30px;border-radius:50%;display:inline-grid;place-items:center;background:repeating-conic-gradient(var(--cc) 0 22deg,#fff 0 32deg,var(--cc) 0 45deg);box-shadow:0 3px 0 rgba(0,0,0,.5)}
.hg-chp::before{content:"";position:absolute;inset:5px;border-radius:50%;background:var(--cc);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.6)}
.hg-chp b{position:relative;font:900 10.5px/1 var(--mono);color:var(--ct,#fff)}
.hg-felt{border-radius:18px;background:var(--pat),radial-gradient(120% 90% at 50% 15%,var(--felt),var(--felt2) 70%,var(--felt3));background-size:var(--pat-size),100% 100%;box-shadow:inset 0 0 0 2px rgba(var(--gold-rgb),.3),inset 0 0 30px rgba(0,0,0,.5)}
.hg-clock{height:6px;border-radius:3px;background:rgba(255,255,255,.1);overflow:hidden;flex:none}
.hg-clock i{display:block;height:100%;width:100%;background:var(--c);border-radius:3px;transition:width .25s linear}
.hg-clock.hurry i{background:var(--red)}
/* blackjack */
.bj{position:absolute;inset:0;display:flex;flex-direction:column;gap:8px;overflow-y:auto;overscroll-behavior:contain;padding-bottom:6px;touch-action:pan-y}
.bj-dealer{flex:none;padding:10px 12px 12px}
.bj-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:6px}
.bj-top small{color:var(--felt-ink);opacity:.8;font:700 10.5px/1.25 var(--mono);text-align:right}
.bj-row{display:flex;align-items:center;gap:10px;min-height:62px}
.bj-cards{display:flex;align-items:center;padding-left:14px}
.bj-cards .pc{--cw:44px;margin-left:-14px}
.bj-cards.big{padding-left:18px}.bj-cards.big .pc{--cw:56px;margin-left:-18px}
.bj-tot{margin-left:auto;min-width:54px;padding:7px 12px;border-radius:999px;background:rgba(0,0,0,.42);font:900 20px/1 var(--mono);text-align:center;font-variant-numeric:tabular-nums;white-space:nowrap}
.bj-tot.bust{color:#ff6d7f}.bj-tot.bjk{color:var(--gold-hi);text-shadow:0 0 14px rgba(var(--gold-rgb),.6)}
.bj-hands{display:flex;gap:8px;overflow-x:auto;flex:none;scrollbar-width:none}
.bj-hand{flex:1 0 auto;min-width:min(100%,220px);padding:10px 12px;border-radius:18px;background:linear-gradient(180deg,var(--s3),var(--s2));border:2px solid var(--line);transition:border-color .2s,box-shadow .2s}
.bj-hand.on{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold),0 0 28px rgba(var(--gold-rgb),.3)}
.bj-hand.out{opacity:.62}
.bj-hand header{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;font:800 12px/1 var(--mono);color:var(--dim)}
.bj-badge{padding:4px 8px;border-radius:999px;font:900 11px/1 var(--mono);letter-spacing:.06em;background:rgba(255,255,255,.08);white-space:nowrap}
.bj-badge.win{background:rgba(77,255,138,.18);color:var(--ok)}.bj-badge.lose,.bj-badge.bust{background:rgba(255,77,106,.18);color:#ff8a9c}
.bj-badge.bjk{background:var(--gold);color:var(--gold-ink)}.bj-badge.push{background:rgba(255,255,255,.12)}
.bj-spot{flex:1;min-height:170px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;border-radius:22px;color:var(--ink)}
.bj-spot .ring2{width:136px;height:136px;border-radius:50%;display:grid;place-items:center;align-content:center;gap:6px;border:3px dashed rgba(var(--gold-rgb),.55);background:rgba(0,0,0,.18);transition:transform .12s var(--ease)}
.bj-spot:active .ring2{transform:scale(.95)}
.bj-spot.has .ring2{border-style:solid;border-color:var(--gold);box-shadow:0 0 30px rgba(var(--gold-rgb),.3)}
.bj-spot .ring2 b{font:900 15px/1 var(--disp)}.bj-spot small{color:rgba(255,255,255,.75);font-size:12.5px}
.bj-spot .others{font:700 11px/1 var(--mono);color:rgba(255,255,255,.6)}
.bj-watch{flex:1;display:grid;place-items:center;text-align:center;color:var(--dim);padding:16px}
.bj-moves{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:8px;flex:none;padding-top:2px}
.bj-mv{min-height:60px;border-radius:16px;font:900 17px/1.05 var(--disp);color:#fff;box-shadow:0 5px 0 rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.25);transition:transform .08s,box-shadow .08s}
.bj-mv small{display:block;font:700 11px/1.2 var(--mono);opacity:.85;margin-top:3px}
.bj-mv:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.4)}
.bj-hit{background:linear-gradient(180deg,#22c06a,#11823f)}.bj-stand{background:linear-gradient(180deg,#e8344a,#a81528)}
.bj-dbl,.bj-ins{background:linear-gradient(180deg,var(--gold-hi),var(--gold2));color:var(--gold-ink)}.bj-split{background:linear-gradient(180deg,#4f8dff,#1f4fc8)}
.bj-sur{background:linear-gradient(180deg,#5a5a66,#34343e)}
/* baccarat */
.bc{position:absolute;inset:0;display:flex;flex-direction:column;gap:8px;overflow-y:auto;overscroll-behavior:contain;padding-bottom:4px;touch-action:pan-y}
.closed .bc{padding-top:48px}
.bc-felt{flex:none;display:grid;grid-template-columns:1fr 1fr;overflow:hidden;position:relative}
.bc-side{padding:10px 8px 12px;display:flex;flex-direction:column;align-items:center;gap:6px;position:relative;transition:filter .3s}
.bc-side+.bc-side{box-shadow:inset 1px 0 0 rgba(255,255,255,.12)}
.bc-side h3{margin:0;font:900 12px/1 var(--mono);letter-spacing:.2em}
.bc-side.p h3{color:#9cc0ff}.bc-side.b h3{color:#ff9aa8}
.bc-side .tot{font:900 34px/1 var(--mono);text-shadow:0 2px 0 rgba(0,0,0,.4);min-height:34px}
.bc-side .cs{display:flex;align-items:center;gap:4px;min-height:58px}
.bc-side .cs .pc{--cw:38px}.bc-side .cs .pc.third{transform:rotate(90deg);margin:0 8px}
.bc-side.won{background:radial-gradient(circle at 50% 40%,rgba(var(--gold-rgb),.28),transparent 70%)}
.bc-side.won .tot{color:var(--gold)}
.bc-side.lost{filter:brightness(.55)}
.bc-tie{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);padding:8px 14px;border-radius:999px;background:#0f9a52;font:900 16px/1 var(--disp);box-shadow:0 0 30px rgba(15,154,82,.6);z-index:2}
.bc-beads{display:flex;gap:4px;flex-wrap:wrap;min-height:22px;padding:0 2px;flex:none}
.bc-beads i{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font:900 11px/1 var(--mono);font-style:normal;color:#fff;position:relative}
.bc-beads i.pp::after,.bc-beads i.bp::before{content:"";position:absolute;width:6px;height:6px;border-radius:50%;background:#fff;box-shadow:0 0 0 1.5px #000}
.bc-beads i.pp::after{left:-1px;top:-1px}.bc-beads i.bp::before{right:-1px;bottom:-1px}
.bc-zones{flex:1;min-height:150px;display:grid;grid-template-columns:1fr .8fr 1fr;gap:8px}
.bc-pairs{flex:none;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bc-z{position:relative;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;padding:10px 4px;color:#fff;
  background:linear-gradient(180deg,rgba(255,255,255,.1),rgba(0,0,0,.25)),var(--zc);box-shadow:inset 0 0 0 2px rgba(255,255,255,.18),0 8px 20px rgba(0,0,0,.4);transition:transform .12s var(--ease),filter .2s}
.bc-z:active{transform:scale(.97)}
.bc-z .zl{font:900 16px/1 var(--disp);letter-spacing:.06em;text-transform:uppercase}
.bc-z .zp{font:900 12.5px/1 var(--mono);padding:4px 8px;border-radius:999px;background:rgba(0,0,0,.35);white-space:nowrap}
.bc-z .zb{min-height:30px;display:flex;align-items:center;gap:6px;font:900 13px/1 var(--mono)}
.bc-z .zo{font:700 10.5px/1 var(--mono);opacity:.75;min-height:11px}
.bc-z.small{flex-direction:row;min-height:58px;gap:8px;padding:6px 10px}.bc-z.small .zl{font-size:13px}
.bc-z.won{box-shadow:inset 0 0 0 3px #fff,0 0 36px var(--zc);animation:pulse 1s ease-in-out infinite}
.bc-z.lost{filter:brightness(.45) saturate(.6)}.bc-z.push{filter:brightness(.8)}
.bc-p{--zc:#1f5fe0}.bc-t{--zc:#0f8a4a}.bc-b{--zc:#c81f3a}.bc-pp{--zc:#16408f}.bc-bp{--zc:#8a1528}
/* slots */
.sl{position:absolute;inset:0;display:flex;flex-direction:column;gap:10px;overflow-y:auto;overscroll-behavior:contain;padding-bottom:6px;touch-action:pan-y}
.sl-cab{display:grid;grid-template-columns:minmax(0,1fr) 62px;gap:10px;flex:none}
.sl-mach{position:relative;border-radius:22px;padding:10px;background:linear-gradient(180deg,#2c1a44,#120a1e);box-shadow:inset 0 0 0 3px var(--gold2),inset 0 0 0 6px #5a3a0a,0 14px 30px rgba(0,0,0,.55)}
.sl-mach.neon{background:linear-gradient(180deg,#1a0a2a,#07020f);box-shadow:inset 0 0 0 3px #ff3fd0,inset 0 0 18px rgba(255,63,208,.45),0 14px 30px rgba(0,0,0,.55)}
.sl-mach.space{background:radial-gradient(120% 80% at 50% 0,#0c2a44,#040a14);box-shadow:inset 0 0 0 3px #1ed8e8,inset 0 0 18px rgba(30,216,232,.35),0 14px 30px rgba(0,0,0,.55)}
.sl-name{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:2px 4px 8px;font:900 13px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--gold-hi)}
.sl-name small{font:700 11px/1 var(--mono);letter-spacing:.02em;color:rgba(255,255,255,.72);text-transform:none;white-space:nowrap}
.sl-win{--cell:min(64px,19vw);display:grid;grid-template-columns:repeat(3,1fr);gap:6px;position:relative}
.sl-reel{height:calc(var(--cell) * 3);overflow:hidden;border-radius:12px;background:linear-gradient(180deg,#0b0712,#221832 30%,#221832 70%,#0b0712);position:relative;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.sl-strip{position:absolute;left:0;right:0;top:0;will-change:transform}
.sl-cell{height:var(--cell);display:grid;place-items:center}
.sl-cell canvas{width:calc(var(--cell) * .74);height:calc(var(--cell) * .74)}
.sl-reel.blur .sl-strip{filter:blur(1.4px) brightness(.85)}
.sl-mark{position:absolute;left:3px;right:3px;height:calc(var(--cell) - 4px);border-radius:10px;pointer-events:none;box-shadow:inset 0 0 0 3px var(--gold),0 0 18px rgba(var(--gold-rgb),.6);background:rgba(var(--gold-rgb),.14);animation:pulse .8s ease-in-out infinite;z-index:2}
.sl-pay{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;z-index:3}
.sl-pay b{padding:10px 18px;border-radius:16px;background:var(--veil);border:2px solid var(--gold);font:900 34px/1 var(--mono);color:var(--gold-text);text-shadow:0 0 24px rgba(var(--gold-rgb),.7);animation:winpop .5s var(--ease) both}
.sl-pay b small{display:block;font:800 11px/1.3 var(--mono);color:var(--dim);letter-spacing:.1em;text-align:center}
.sl-lever{position:relative;border-radius:31px;background:linear-gradient(90deg,#2a1d0a,#4a3410 50%,#2a1d0a);box-shadow:inset 0 0 0 2px var(--gold-deep),0 10px 20px rgba(0,0,0,.5);touch-action:none;cursor:grab;min-height:200px}
.sl-lever .slot{position:absolute;left:50%;top:26px;bottom:34px;width:10px;margin-left:-5px;border-radius:5px;background:#0a0603;box-shadow:inset 0 2px 4px rgba(0,0,0,.8)}
.sl-lever .rod{position:absolute;left:50%;top:30px;width:8px;margin-left:-4px;height:0;border-radius:4px;background:linear-gradient(90deg,#888,#eee,#888)}
.sl-knob{position:absolute;left:50%;top:4px;width:54px;height:54px;margin-left:-27px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff9a9a,#e0283c 50%,#7a0b18);box-shadow:0 6px 12px rgba(0,0,0,.55),inset 0 -4px 0 rgba(0,0,0,.25);transition:transform .55s cubic-bezier(.25,1.7,.45,1)}
.sl-lever.drag .sl-knob,.sl-lever.drag .rod{transition:none}
.sl-lever .rod{transition:height .55s cubic-bezier(.25,1.7,.45,1)}
.sl-lever.off{filter:grayscale(.85) brightness(.6);cursor:default}
.sl-lever .hint{position:absolute;left:0;right:0;bottom:8px;text-align:center;font:900 10px/1.1 var(--mono);color:rgba(var(--gold-rgb),.85);letter-spacing:.08em}
.sl-bets{display:flex;gap:6px;flex:none;overflow-x:auto;scrollbar-width:none}
.sl-bet{flex:1 0 auto;min-width:54px;min-height:48px;border-radius:12px;background:var(--s2);border:1.5px solid rgba(var(--gold-rgb),.22);font:900 15px/1 var(--mono)}
.sl-bet small{display:block;font:700 9.5px/1.3 var(--mono);color:var(--mute)}
.sl-bet[aria-checked=true]{background:linear-gradient(180deg,var(--gold-hi),var(--gold));color:var(--gold-ink);border-color:transparent}
.sl-bet[aria-checked=true] small{color:var(--gold-ink);opacity:.75}
.sl-bet:disabled{opacity:.3}
.sl-go{flex:none;min-height:58px;border-radius:18px;background:linear-gradient(180deg,var(--gold-hi),var(--gold) 45%,var(--gold2));color:var(--gold-ink);font:900 19px/1 var(--disp);box-shadow:0 6px 0 var(--gold-deep),0 0 34px var(--glow)}
.sl-go:active{transform:translateY(4px);box-shadow:0 2px 0 var(--gold-deep)}.sl-go:disabled{filter:grayscale(.8) brightness(.6);box-shadow:0 6px 0 var(--s4)}
.sl-msg{flex:none;text-align:center;color:var(--dim);font-size:13px;min-height:18px}
.sl-msg b{color:var(--ink)}
.sl-seal{flex:none;text-align:center;font:700 10.5px/1.2 var(--mono);color:var(--mute)}
.sl-pt{display:inline-flex;align-items:center;gap:2px;vertical-align:middle}.sl-pt img{width:22px;height:22px}
@media (orientation:landscape) and (max-height:560px){.sl-win{--cell:44px}.sl-lever{min-height:140px}.bc-zones{min-height:110px}}
/* ===== END house games block ===== */
/* ===== BEGIN housie block (Housie / Tambola) — helpers prefixed .hs- ===== */
.hs{position:absolute;inset:0;display:flex;flex-direction:column;gap:10px;overflow-y:auto;overscroll-behavior:contain;padding:2px 0 calc(var(--sb) + 14px);touch-action:pan-y}
.hs>*{flex-shrink:0}
.hs-now{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:16px;background:var(--s2);border:1px solid var(--line);min-height:84px}
.hs-ball{--bc:var(--gold2);flex:none;width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font:900 28px/1 var(--mono);color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.3);
  background:radial-gradient(circle at 34% 28%,rgba(255,255,255,.55),rgba(255,255,255,0) 40%),var(--bc);box-shadow:inset 0 -6px 0 rgba(0,0,0,.25),0 0 20px rgba(0,0,0,.4)}
.hs-ball.none{--bc:var(--s4);color:var(--mute);font-size:20px}
.hs-ball.pop{animation:hspop .5s var(--ease)}
@keyframes hspop{0%{transform:scale(.3) rotate(-90deg)}70%{transform:scale(1.12)}100%{transform:none}}
.hs-nw{min-width:0;flex:1;display:flex;flex-direction:column;gap:6px}
.hs-nm{font:italic 700 14px/1.2 var(--disp);color:var(--gold-hi);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hs-rc{display:flex;gap:4px;align-items:center;overflow:hidden}
.hs-rc i{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font:850 11.5px/1 var(--mono);font-style:normal;color:#fff;opacity:.8;background:var(--bc)}
.hs-rc i:first-child{opacity:1}

<script>
"use strict";

// <deskdot-logo> The DeskDot logo in LEDs: a plain-JS copy of web/src/lib/logo.ts (same glyphs, tubes, colours and
// timings; tests/test_logo_copies.py keeps every copy identical). Three neon tubes, "D", "esk", "Dot": the D drops
// in, "esk" types in, "Dot" rains down, then each tube is struck like neon, hums, powers down and loops. The canvas
// redraws only while something moves (build, strike, the loose letter's blink, power-down), idles in between and
// stops while the page is hidden; reduced motion draws it lit once. DeskDotLogo.mount(canvas, { pitch, grid, dpr }).
const DeskDotLogo = (() => {
  const GLYPHS = {
    D: ["###.", "#..#", "#..#", "#..#", "#..#", "#..#", "###."],
    e: ["....", "....", ".##.", "#..#", "####", "#...", ".###"],
    s: ["....", "....", ".###", "#...", ".##.", "...#", "###."],
    k: ["#...", "#...", "#..#", "#.#.", "##..", "#.#.", "#..#"],
    o: ["....", "....", ".##.", "#..#", "#..#", "#..#", ".##."],
    t: ["...", ".#.", "###", ".#.", ".#.", ".#.", "..#"],
  };
  const TUBES = ["D", "esk", "Dot"];
  const LOGO = ["#ff3f78", "#ff3f78", "#ffcc33"];
  const STRIKE = [
    [[0.05, 1], [0.07, 0], [0.03, 0.7], [0.16, 0], [0.04, 1], [0.05, 0.15], [0.09, 0.55], [0.05, 0], [0.06, 0.9], [0.04, 0.4]],
    [[0.04, 0.6], [0.12, 0], [0.05, 1], [0.04, 0], [0.03, 1], [0.22, 0.05], [0.05, 0.8], [0.03, 0.2], [0.07, 1], [0.05, 0.5]],
    [[0.03, 0.8], [0.05, 0], [0.04, 0.5], [0.09, 0], [0.05, 1], [0.03, 0], [0.12, 0.3], [0.04, 1], [0.08, 0.1], [0.06, 0.85]],
  ];
  const DELAY = [0, 0.28, 0.12];
  const glitchLetter = 5;
  const ROWS = 7;
  const HEADER = { build: 1.5, hold: 14, off: 1.2 };
  const PAD = 2.2; // dots of room round the word for the glow

  const dots = [];
  let cols = 0;
  {
    const parts = [];
    let letter = 0;
    TUBES.forEach((w, part) => {
      if (part) cols += 1;
      const from = cols;
      [...w].forEach((ch, i) => {
        const g = GLYPHS[ch];
        if (i) cols += 1;
        g.forEach((row, y) => [...row].forEach((c, dx) => {
          if (c === "#") dots.push({ x: cols + dx, y, part, col: 0, seed: Math.random(), letter });
        }));
        cols += g[0].length;
        letter++;
      });
      parts.push({ from, to: cols });
    });
    for (const d of dots) {
      const p = parts[d.part];
      d.col = (d.x - p.from) / Math.max(1, p.to - p.from - 1);
    }
  }

  const strikeLen = (p) => STRIKE[p].reduce((n, [d]) => n + d, 0);
  const strike = (p, t) => {
    if (t < 0) return 0;
    let acc = 0;
    for (const [d, v] of STRIKE[p]) if (t < (acc += d)) return v;
    return 1;
  };
  const easeOut = (k) => 1 - (1 - k) ** 3;
  const bounce = (k) => {
    const n = 7.5625, d = 2.75;
    if (k < 1 / d) return n * k * k;
    if (k < 2 / d) return n * (k -= 1.5 / d) * k + 0.75;
    if (k < 2.5 / d) return n * (k -= 2.25 / d) * k + 0.9375;
    return n * (k -= 2.625 / d) * k + 0.984375;
  };
  let glows = null;
  const glowSprite = (color) => {
    const c = document.createElement("canvas");
    c.width = c.height = 64;
    const g = c.getContext("2d");
    const r = g.createRadialGradient(32, 32, 0, 32, 32, 32);
    r.addColorStop(0, color);
    r.addColorStop(0.25, color + "aa");
    r.addColorStop(0.6, color + "22");
    r.addColorStop(1, color + "00");
    g.fillStyle = r;
    g.fillRect(0, 0, 64, 64);
    return c;
  };

  const tl = HEADER;
  const cycle = tl.build + 1.4 + tl.hold + tl.off;
  const igniteAt = tl.build + 0.15;
  const offAt = tl.build + 1.4 + tl.hold;
  const litAt = Math.max(tl.build + 0.6, igniteAt + Math.max(...[0, 1, 2].map((p) => DELAY[p] + strikeLen(p)))) + 0.05;

  /** Draw at (ox, oy) with dot pitch p (CSS px); lt = seconds into the loop. */
  function draw(ctx, lt, ox, oy, p, grid, still) {
    if (!glows) glows = LOGO.map(glowSprite);
    if (still) lt = tl.build + 3;
    const r = p * 0.36;
    if (grid) {
      ctx.fillStyle = "rgba(255,255,255,0.045)";
      for (let y = 0; y < ROWS; y++)
        for (let x = 0; x < cols; x++) {
          ctx.beginPath();
          ctx.arc(ox + (x + 0.5) * p, oy + (y + 0.5) * p, r * 0.7, 0, Math.PI * 2);
          ctx.fill();
        }
    }
    for (let part = 0; part < 3; part++) {
      let level = strike(part, lt - igniteAt - DELAY[part]);
      const lit = lt > igniteAt + DELAY[part] + strikeLen(part);
      if (lit) level = still ? 1 : 0.93 + 0.07 * Math.sin(lt * 47 + part * 3) * Math.sin(lt * 13.3);
      let dying = 0;
      if (lt > offAt) {
        dying = Math.min(1, (lt - offAt) / tl.off);
        const sputter = dying < 0.35 ? (Math.sin(lt * 90) > 0.2 ? 1 : 0.25) : 0;
        level = Math.max(0, 1 - dying * 2.4) * (0.5 + sputter * 0.5);
      }
      const color = LOGO[part], glow = glows[part];
      for (const d of dots) {
        if (d.part !== part) continue;
        let x = d.x, y = d.y, k, pop = 0;
        if (part === 0) {
          k = Math.min(1, Math.max(0, (lt - (6 - d.y) * 0.05) / 0.5));
          y = d.y - (1 - bounce(k)) * 9;
        } else if (part === 1) {
          k = Math.min(1, Math.max(0, (lt - (d.col * tl.build * 0.75 + d.y * 0.012)) / 0.22));
          pop = k > 0 && k < 1 ? Math.sin(k * Math.PI) : 0;
          x = d.x - (1 - easeOut(k)) * 1.2;
        } else {
          k = Math.min(1, Math.max(0, (lt - ((1 - d.col) * tl.build * 0.55 + d.seed * tl.build * 0.3)) / 0.55));
          y = d.y - (1 - bounce(k)) * (6 + d.y);
        }
        if (k <= 0) continue;
        let fade = 1;
        if (dying > 0.35) {
          const q = Math.min(1, Math.max(0, (dying - 0.35) / 0.65 - (part === 2 ? d.seed * 0.3 : d.col * 0.4)));
          fade = 1 - q;
          if (part !== 2) x += easeOut(q) * 3;
          else y += q * q * 9;
          if (fade <= 0) continue;
        }
        let lv = level;
        if (lit && !still && dying === 0 && d.letter === glitchLetter) {
          const g = (lt * 0.37) % 1;

/* =====================================================================================================
   GAME: 7 Up 7 Down — two dice; bet under 7, lucky 7 or over 7.
   ===================================================================================================== */
registerGame("sevens", (() => {
  const PIPS = { 1: [4], 2: [0, 8], 3: [0, 4, 8], 4: [0, 2, 6, 8], 5: [0, 2, 4, 6, 8], 6: [0, 2, 3, 5, 6, 8] };
  const Z = [["down", "Under 7", "▼", "2 · 3 · 4 · 5 · 6"], ["seven", "Lucky 7", "7", "7"], ["up", "Over 7", "▲", "8 · 9 · 10 · 11 · 12"]];
  let el, tray, dice = [], zones = {}, sum, wait, rollT = 0, ctxs;
  function face(d, n) { $$("i", d).forEach((p, i) => p.classList.toggle("on", PIPS[n].includes(i))); }
  return {
    title: "7 Up 7 Down",
    ticks: true,
    tour: "Three zones: <b>Under 7</b>, <b>Lucky 7</b> and <b>Over 7</b>. Tap one to put your chip on it (every tap adds one), hold it or drag your stack off to take it back. Coloured dots show who else is there.",
    spinTitle: "Rolling…",

    mount(host, c) {

      tray = document.createElement("div"); tray.className = "tray";
      for (let i = 0; i < 2; i++) { const d = document.createElement("div"); d.className = "die"; d.innerHTML = "<i></i>".repeat(9); face(d, i ? 4 : 3); tray.append(d); dice.push(d); }
      sum = document.createElement("div"); sum.className = "sum"; wait = document.createElement("div"); wait.className = "wait"; tray.append(sum, wait);
      const zs = document.createElement("div"); zs.className = "zones";
      for (const [id, name, icon, nums] of Z) {
        const z = document.createElement("button"); z.className = "zone z-" + id; z.dataset.spot = id;
        z.innerHTML = `<span class="zi">${icon}</span><span class="zl">${name}</span><span class="zs">${nums}</span><span class="zp"></span><span class="zb"></span><span class="zo"></span>`;
        zs.append(z); zones[id] = z; // tap / hold / drag: the core's board gestures ([data-spot])
      }
      el.append(tray, zs);
    },
    update(c) {
      ctxs = c; const p = c.pub, ph = p.phase, rules = p.rules || {}, mine = c.priv.bets || {}, totals = p.totals || {};
      const rolling = ph === "locked" || ph === "spinning";
      tray.classList.toggle("rolling", rolling && !REDUCED);
      clearInterval(rollT);
      if (rolling) rollT = setInterval(() => dice.forEach((d) => face(d, 1 + Math.floor(Math.random() * 6))), 110);
      const res = ph === "result" && p.result ? p.result : null;
      if (res) { dice.forEach((d, i) => face(d, res.outcome.dice[i])); sum.textContent = res.outcome.sum; } else sum.textContent = "";
      const last = (p.history || []).slice(-1)[0];
      if (!res && !rolling && last && last.outcome) dice.forEach((d, i) => face(d, last.outcome.dice[i]));
      wait.textContent = rolling ? "Watch the panel!" : ph === "betting" ? "Bet on where the next roll lands" : "";
      for (const [id] of Z) {

        $(".zb", z).innerHTML = m ? `<span class="chp" style="${chipStyle(m)}"><b>${short(m)}</b></span><b class="num">${fmt(m)}</b>` : "";

    replay(rng) { const a = rng.randint(1, 6), b = rng.randint(1, 6), s = a + b; return { dice: [a, b], sum: s, zone: s < 7 ? "down" : s === 7 ? "seven" : "up" }; },

      return `<table class="pays"><tr><td>Under 7 (2–6)<br><small class="note">house edge ${pct("down")}</small></td><td>1:1</td></tr><tr><td>Lucky 7<br><small class="note">house edge ${pct("seven")}</small></td><td>${sp}:1</td></tr><tr><td>Over 7 (8–12)<br><small class="note">house edge ${pct("up")}</small></td><td>1:1</td></tr></table>`;

/* =====================================================================================================
   BEGIN cards & wheels block: Texas Hold'em · Teen Patti · Andar Bahar · Big Six (rules in deskdot/casino/games/).
   PC.* are this block's helpers (playing cards, the deck replay, the player-vs-player chrome).
   ===================================================================================================== */
const PC = (() => {
  const SUIT = { S: "♠", H: "♥", D: "♦", C: "♣" }, SUITN = { S: "spades", H: "hearts", D: "diamonds", C: "clubs" };
  const RK = { 10: "T", 11: "J", 12: "Q", 13: "K", 14: "A" };
  const rk = (c) => (c[0] === "T" ? "10" : c[0]);
  function card(code, cls = "") {
    if (!code) return `<span class="pc back ${cls}" aria-label="face-down card"></span>`;
    return `<span class="pc ${"HD".includes(code[1]) ? "red" : ""} ${cls}" aria-label="${rk(code)} of ${SUITN[code[1]]}"><b>${rk(code)}</b><i>${SUIT[code[1]]}</i></span>`;
  }
  const empty = () => `<span class="pc empty" aria-hidden="true"></span>`;
  /** cards.new_deck() order (suits S H D C, ranks 2..A) shuffled exactly like fair.Rng.shuffle (Fisher–Yates from the top) */
  function deck(rng) {
    const d = [];
    for (const s of "SHDC") for (let r = 2; r <= 14; r++) d.push((RK[r] || String(r)) + s);
    for (let i = d.length - 1; i > 0; i--) { const j = rng.randint(0, i); const t = d[i]; d[i] = d[j]; d[j] = t; }
    return d;
  }
  const cap = (s) => String(s || "").replace(/^./, (c) => c.toUpperCase());
  /** the player strip: everyone in the hand, their stack, what they did; `extra(seat)` adds a tag */
  function seats(c, extra) {
    const t = (c.pub.table || {}), list = t.seats || [];
    if (!list.length) {
      const sit = new Set(c.pub.sitting || []);
      return (c.pub.players || []).filter((p) => p.online && p.seat !== "host" || sit.has(p.seat)).map((p) =>
        `<div class="pv-seat ${sit.has(p.seat) ? "" : "out"} ${p.seat === S.seat ? "me" : ""}"><b style="color:${esc(p.color)}">${esc(p.name)}</b><small>${fmt(p.credits)}</small><small>${sit.has(p.seat) ? "in" : "sitting out"}</small></div>`).join("");
    }
    return list.map((s) => {
      const tag = extra ? extra(s) : "";
      return `<div class="pv-seat ${s.turn || t.turn_seat === s.seat ? "turn" : ""} ${s.folded ? "out" : ""} ${s.seat === S.seat ? "me" : ""}">${tag}<b style="color:${esc(s.color)}">${esc(s.name)}</b><small>${fmt(s.stack)} left</small><small>${s.folded ? (s.last || "out").toLowerCase() : s.allin ? "ALL-IN" : s.last ? s.last.toLowerCase() + (s.total ? " · " + fmt(s.total) : "") : "in " + fmt(s.total)}</small></div>`;
    }).join("");
  }
  /** a turn clock that runs smoothly between state pushes */
  function clock(el, left, span) {
    const at = performance.now();
    clearInterval(el._t);
    const tick = () => { const l = Math.max(0, left - (performance.now() - at) / 1000); const i = el.firstElementChild; if (i) i.style.width = (100 * Math.min(1, l / span)) + "%"; el.classList.toggle("hurry", l <= 5); };
    tick(); el._t = setInterval(tick, 250);
  }
  /** the PvP tables have no chip rack: hide the core dock while mounted, and say what the table is doing */
  function chrome(on) { const d = $(".dock"); if (d) d.hidden = on; }
  function phase(title, sub) { if (title != null) { $("#ph-title").textContent = title; $("#ph-sub").textContent = sub; } $("#lockb").hidden = true; $("#s-table").classList.remove("closed"); }
  function results(c, label) {
    const t = c.pub.table || {}, wins = new Map((t.winners || []).map((w) => [w.seat, w])), shown = t.showdown || {};
    const rows = (t.seats || []).filter((s) => wins.has(s.seat) || shown[String(s.seat)]);
    return `<div class="pv-res">${rows.map((s) => { const w = wins.get(s.seat), cs = shown[String(s.seat)] || [];
      return `<div class="r ${w ? "rw" : ""}">${cs.map((x) => card(x)).join("")}<b style="color:${esc(s.color)}">${esc(s.name)}</b><small class="num">${w ? "+" + fmt(w.won) : ""} ${esc(label(s, w))}</small></div>`; }).join("")}</div>`;
  }
  return { card, empty, deck, cap, seats, clock, chrome, phase, results };
})();

/* GAME: Texas Hold'em — own hole cards, the board, the pot, fold / check / call / raise (slider + ½ pot, pot, all-in). */
registerGame("holdem", (() => {
  let root, c, sig = "", raiseTo = 0, open = false, betKey = "";
  const HAND = { "high card": "High card", pair: "Pair", "two pair": "Two pair", "three of a kind": "Three of a kind", straight: "Straight", flush: "Flush", "full house": "Full house", "four of a kind": "Four of a kind", "straight flush": "Straight flush", "royal flush": "Royal flush" };
  function presets(p, t) {
    const pot = t.pot || 0, call = p.to_call || 0, cur = t.cur_bet || 0, lo = p.min_to || 0, hi = p.max_to || 0;
    const clampTo = (v) => Math.max(lo, Math.min(hi, Math.round(v)));
    return [["Min", lo], ["½ pot", clampTo(cur + (pot + call) / 2)], ["Pot", clampTo(cur + pot + call)], ["All-in", hi]];
  }
  function act(p, t) {
    const ops = p.ops || [];
    if (!p.my_turn || !ops.length) return "";
    const word = p.bet_word === "bet" ? "Bet" : "Raise";
    const call = ops.includes("call") ? `<button class="pv-btn call" data-op="call">Call<small>${fmt(p.to_call)}${p.to_call >= (p.max_to - p.my_bet) ? " · all-in" : ""}</small></button>` : `<button class="pv-btn call" data-op="check">Check<small>free</small></button>`;
    const canRaise = ops.includes("raise"), key = `${t.hand}:${t.street}:${t.cur_bet}`;
    if (key !== betKey) { betKey = key; raiseTo = p.min_to || p.max_to; }
    if (!raiseTo || raiseTo < p.min_to || raiseTo > p.max_to) raiseTo = p.min_to || p.max_to;
    let html = `<div class="pv-timer" id="he-tm"><i></i></div><div class="pv-btns"><button class="pv-btn fold" data-op="fold">Fold</button>${call}`;
    html += canRaise ? `<button class="pv-btn raise" data-op="open">${word}<small>${open ? "▲" : "to " + fmt(raiseTo)}</small></button>` : ops.includes("allin") ? `<button class="pv-btn raise" data-op="allin">All-in<small>${fmt(p.max_to)}</small></button>` : `<button class="pv-btn" disabled>${word}</button>`;
    html += `</div>`;
    if (canRaise && open) {
      html += `<div class="pv-slide"><div class="pv-amt"><span><small>${word} to </small><span id="he-amt">${fmt(raiseTo)}</span></span><small>min ${fmt(p.min_to)} · max ${fmt(p.max_to)}</small></div>
        <input type="range" id="he-rng" min="${p.min_to}" max="${p.max_to}" step="1" value="${raiseTo}" aria-label="${word} amount">
        <div class="pv-pre">${presets(p, t).map(([n, v]) => `<button data-to="${v}">${n}</button>`).join("")}</div>
        <button class="pv-btn raise" data-op="raise">${word} to <span id="he-amt2">${fmt(raiseTo)}</span></button></div>`;
    }
    return html;
  }
  function render() {
    const pub = c.pub, p = c.priv, t = pub.table || {}, ph = pub.phase;
    const inHand = !!(p.cards && p.cards.length) && ph !== "betting";
    let hand = "";
    if (inHand) hand = `<div class="pv-hand"><div class="pv-row">${p.cards.map((x) => PC.card(x, p.folded ? "dim" : "")).join("")}</div><div class="nm"><b>${p.folded ? "Folded" : HAND[p.hand] || "Your hole cards"}</b><small>${p.folded ? "Watch the rest of the hand" : p.hand ? "Best five with the board" : "Only you can see these"}</small></div></div>`;
    const board = t.board || [];
    const pots = t.pots || [];
    const felt = `<div class="pv-felt"><div class="pv-pot"><small>POT</small>${fmt(t.pot || 0)}</div>${pots.length > 1 ? `<div class="pv-sub">${pots.map((x, i) => (i ? "side " : "main ") + fmt(x.amount)).join(" · ")}</div>` : ""}<div class="pv-row">${[0, 1, 2, 3, 4].map((i) => (board[i] ? PC.card(board[i], (pub.phase === "result" && ((t.winners || [])[0] || {}).best || []).includes(board[i]) ? "hi" : "") : PC.empty())).join("")}</div><div class="pv-sub">Blinds ${(t.blinds || []).map(fmt).join(" / ")}${t.cur_bet ? " · bet " + fmt(t.cur_bet) : ""}</div></div>`;

        <button class="pv-sit ${p.sitting ? "pill" : "go"}" data-op="sit">${p.sitting ? "Sit out next hand" : "Deal me in"}</button>`;
    } else if (ph === "result") below = PC.results(c, (s, w) => (w && w.hand ? HAND[w.hand] : w ? "takes the pot" : ""));
    else if (inHand && p.my_turn) below = `<div class="pv-act">${act(p, t)}</div>`;
    else if (ph === "action" || ph === "dealing") { const ts = (t.seats || []).find((s) => s.seat === t.turn_seat); below = `<div class="pv-wait">${ts ? `${esc(ts.name)} is thinking…` : "Dealing…"}${inHand ? "" : " · you're not in this hand"}</div>`; }
    const html = `<div class="pv-seats">${PC.seats(c, (s) => (s.seat === t.button_seat ? `<span class="tag">D</span>` : s.allin ? `<span class="tag ai">AI</span>` : ""))}</div>${felt}${hand}${below}`;
    if (html !== sig) { sig = html; root.innerHTML = html; const tm = $("#he-tm", root); if (tm) PC.clock(tm, p.turn_in || 0, (pub.house || {}).turn_seconds || 20); }
    const me = (t.seats || []).find((s) => s.seat === S.seat);
    if (ph === "action" || ph === "dealing") PC.phase(p.my_turn ? "Your move" : "Hold'em", p.my_turn ? (p.to_call ? `${fmt(p.to_call)} to call` : "Check or bet") : me && !me.folded ? `Your stack ${fmt(me.stack)}` : "Watch the panel");

    update(cx) { c = cx; if (!c.priv.my_turn) open = false; render(); },

    describe: (o) => `deck ${o.deck.split(" ").slice(0, 6).join(" ")} …`,
    paytable(cx) { const r = cx.pub.rules || {}; return `<table class="pays"><tr><td>Blinds</td><td>${fmt(r.small_blind)} / ${fmt(r.big_blind)}</td></tr><tr><td>Blinds double every</td><td>${r.blind_up_every ? r.blind_up_every + " hands" : "never"}</td></tr><tr><td>Rake</td><td>${r.rake_percent ? r.rake_percent + " %" : "none"}</td></tr></table><p class="note">No-limit: raise at least the last raise; all-in any time. Side pots for every all-in; ties split, odd chip to the first winner left of the button. Timer: check if free, else fold.</p>`; },

/* GAME: Andar Bahar — the joker, Andar / Bahar zones and the card-count side bets. */
registerGame("andarbahar", (() => {
  let root, c, sig = "";
  const BANDS_V = [[1, 5], [6, 10], [11, 15], [16, 25], [26, 30], [31, 35], [36, 40], [41, 49]];
  const BANDS_X = [[1, 5], [6, 10], [11, 15], [16, 25], [26, 30], [31, 35], [36, 40], [41, 52]];
  let BANDS = BANDS_V;
  const exactOf = (r) => (r || {}).match === "card"; // host option: only the identical card (rank + suit) wins
  const RANKW = { A: "ace", K: "king", Q: "queen", J: "jack", T: "10" };
  const rankOf = (code) => (code[0] === "T" ? "10" : code[0]);

      : `Looking for <b>any ${rankWord(d.joker)}</b> — ${["S", "H", "D", "C"].filter((x) => x !== d.joker[1]).map((x) => any + SUITC[x]).join(" · ")} all match.`;

/* =====================================================================================================
   BEGIN house games block: Blackjack · Baccarat · Slots (rules in deskdot/casino/games/).
   HG.* are this block's helpers; cards reuse PC.card from the block above. Every replay() mirrors the Python
   draw order exactly (cards.DealingShoe: a lazy Fisher–Yates read from the bottom of the shoe).
   ===================================================================================================== */
const HG = (() => {
  const RK = { 10: "T", 11: "J", 12: "Q", 13: "K", 14: "A" };
  const KINDS = []; // cards.CARD_KINDS: suits S H D C, ranks 2..A
  for (const s of "SHDC") for (let r = 2; r <= 14; r++) KINDS.push((RK[r] || String(r)) + s);
  /** cards.DealingShoe: `comp` is one digit per card kind; dealing card k = one Fisher–Yates step from the bottom */
  function shoe(comp, decks, rng) {
    let counts = [...String(comp)].map(Number), cards = [];
    const drawn = [];
    const expand = () => { cards = []; KINDS.forEach((k, i) => { for (let n = 0; n < counts[i]; n++) cards.push(k); }); };
    if (counts.length !== 52 || counts.some((n) => !(n >= 0 && n <= decks))) throw new Error("bad shoe composition");
    expand();
    return {
      draw() {
        if (!cards.length) { const on = {}; for (const c of drawn) on[c] = (on[c] || 0) + 1; counts = KINDS.map((k) => decks - (on[k] || 0)); expand(); }
        const i = cards.length - 1, j = rng.randint(0, i), c = cards[j];
        cards[j] = cards[i]; cards.pop(); drawn.push(c); return c;
      },
    };
  }
  const full = (decks) => String(decks).repeat(52);
  const chip = (n) => `<span class="hg-chp" style="${chipStyle(n)}"><b>${short(n)}</b></span>`;
  /** a smooth turn clock between state pushes */
  function clock(el, left, span) {
    if (!el) return;
    const at = performance.now();
    clearInterval(el._t);
    const tick = () => { const l = Math.max(0, left - (performance.now() - at) / 1000), i = el.firstElementChild; if (i) i.style.width = (100 * Math.min(1, l / span)) + "%"; el.classList.toggle("hurry", l <= 5); };
    tick(); el._t = setInterval(tick, 250);
  }
  /** kept for compatibility: zones carry data-spot and the core's board gestures do tap / hold / drag */
  function zone(el, c, id) { if (el && !el.dataset.spot) el.dataset.spot = id; void c; }
  const pct = (c, k) => { const e = (c.pub.edges || {})[k]; return e != null ? (e * 100).toFixed(2) + " %" : ""; };
  return { shoe, full, chip, clock, zone, pct, KINDS };
})();

/* GAME: Blackjack — the dealer, everyone's hands (public), your hands big, legal moves only, bet before the deal. */
registerGame("blackjack", (() => {
  let root, c, sig = "", myTurnWas = false, lastStatus = "";
  const MV = { hit: ["Hit", "bj-hit"], stand: ["Stand", "bj-stand"], double: ["Double", "bj-dbl"], split: ["Split", "bj-split"], surrender: ["Surrender", "bj-sur"], insurance: ["Insure", "bj-ins"], no_insurance: ["No thanks", "bj-sur"] };
  const cardH = (x) => PC.card(x === "??" ? null : x);
  const tot = (h) => !h.cards.length ? "" : h.bj ? "BJ" : h.soft ? `${h.total - 10}/${h.total}` : String(h.total);
  function rulesLine(r) {
    return `${r.decks || 6} decks · BJ pays ${r.blackjack_pays || "3:2"} · dealer ${r.soft17 === "hit" ? "hits" : "stands on"} soft 17${r.surrender === "late" ? " · surrender" : ""}${r.dealer_peek === false ? " · no peek" : ""}`;
  }
  function badge(h, seat) {
    if (seat.net != null && h === seat.hands[seat.hands.length - 1] && seat.hands.length === 1) {
      return seat.net > 0 ? (h.bj ? `<span class="bj-badge bjk">BLACKJACK +${fmt(seat.net)}</span>` : `<span class="bj-badge win">WIN +${fmt(seat.net)}</span>`) : seat.net < 0 ? `<span class="bj-badge lose">${h.status === "surrender" ? "SURRENDERED" : h.status === "bust" ? "BUST" : "LOSE"}</span>` : `<span class="bj-badge push">PUSH</span>`;
    }
    if (h.bj) return `<span class="bj-badge bjk">BLACKJACK</span>`;

  }

    const p = [draw()], b = [draw()]; p.push(draw()); b.push(draw());

    if (!(pt >= 8 || bt >= 8)) { let third = null; if (pt <= 5) { p.push(draw()); third = VAL(p[2]); } if (banker(bt, third)) b.push(draw()); }
    const P = total(p), B = total(b);

    if (S.sheet === "housie") $("#sh-b").innerHTML = board();
    const fl = h.flash, fk = fl ? `${c.pub.round}:${fl.prize}:${fl.seat}` : "";
    if (fl && fk !== flashKey) {
      flashKey = fk;
      if (fl.age < 4) { const me = fl.seat === S.seat; toast(me ? `${fl.name}! It's yours — verified` : `${fl.who} claims ${fl.name}!`); if (me) { buzz([20, 40, 20, 40, 60]); confetti(18); } else buzz(12); }
    }
    const calls = h.calls || [];
    if (ph === "betting") phase("Buy tickets", c.pub.ends_in != null ? `Calling starts in ${c.pub.ends_in}s · ${fmt(h.price || 0)} a ticket` : `${fmt(h.price || 0)} credits a ticket · up to ${h.max || 1}`);
    else if (ph === "locked" || (ph === "dealing" && !calls.length)) phase("Tickets dealt", (pv.tickets || []).length ? "Check your tickets — calling starts soon" : "You're watching this game");
    else if (ph === "dealing") phase(h.finished ? "Game over" : `Number ${calls[calls.length - 1]}`, h.finished ? "Checking the last claims" : `${calls.length} of 90 · every ${h.pace || 6}s${auto ? " · auto-daub on" : ""}`);
    else if (ph === "idle") phase("Table closed", "Waiting for the host");
  }
  function onClick(e) {
    const b = e.target.closest("[data-act]"); if (!b || b.disabled) return;
    const act = b.dataset.act, pv = P();
    if (act === "board") { openBoard(); buzz(6); return; }
    if (act === "auto") { auto = !auto; store("deskdot.casino.housie.auto", auto); buzz(8); render(); return; }
    if (act === "plus" || act === "minus") {
      const cur = want != null ? want : pv.count || 0, nxt = clamp(cur + (act === "plus" ? 1 : -1), 0, H().max || 1);
      want = nxt; c.send("buy", { count: nxt }); buzz(act === "plus" ? 10 : [6, 20, 6]); renderBuy(); return;
    }
    if (act === "done") { c.send("done"); buzz([12, 30, 12]); return; }
    if (act === "claim") { const t = claimTicket(b.dataset.p); c.send("claim", { prize: b.dataset.p, ticket: t }); buzz(16); return; }
    if (act === "daub") {
      if (auto) { toast("Auto-daub is on — turn it off under Prizes to mark by hand"); return; }
      const n = Number(b.dataset.n);
      if (daubs.has(n)) daubs.delete(n); else { daubs.add(n); buzz(7); }
      saveDaubs(); renderTickets(); renderClaims();
    }
  }
  return {
    title: "Housie", livePanel: false,
    spinTitle: "Calling…",
    resultTitle: (r) => `Full House on call ${r.label}${r.winners && r.winners.length ? " · " + r.winners.slice(0, 2).map((w) => w.name).join(", ") : ""}`,
    mount(host, cx) {
      c = cx; lastCalled = -1; tixKey = ""; flashKey = ""; want = null;
      root = document.createElement("div"); root.className = "hs"; host.append(root);
      for (const id of ["now", "claims", "tix", "buy", "prz"]) { const el = document.createElement("div"); el.className = "hs-" + id; parts[id] = el; root.append(el); }
      root.addEventListener("click", onClick); chrome(true); render();
    },
    update(cx) { c = cx; render(); },
    unmount() { chrome(false); root = null; },
    replay(rng, rules, stored) { return HS.deal(rng, (stored || {}).holders || []); },
    describe: (o) => `${o.tickets.length} ticket${o.tickets.length === 1 ? "" : "s"} · calls ${o.calls.slice(0, 6).join(" ")} …`,
    paytable(cx) {
      const h = cx.pub.housie || {}, r = cx.pub.rules || {};
      return `<table class="pays"><tr><td>Ticket</td><td>${fmt(h.price || r.ticket_price || 0)}</td></tr><tr><td>Max tickets each</td><td>${h.max || r.max_tickets || 1}</td></tr><tr><td>House rake</td><td>${r.rake ? r.rake + " %" : "none"}</td></tr></table>
        <div class="eng" style="margin:10px 0 4px">Prizes (share of the pool)</div>${(h.prizes || []).length ? prizeTable() : ""}
        <p class="note">Players play for the pot: the pool (pot minus the rake) is split by the shares. Claims made on the same call share a prize per ticket; a prize nobody claims is shared back by tickets.</p>`;
    },
  };
})());
/* ===== END housie block ===== */

/* ------------------------------------------------ connection */
let ws = null, backoff = 300, retryT = 0, lastMsg = 0, ended = false;
function net(ok) { const d = $("#netdot"); if (d) d.classList.toggle("off", !ok); }
function end(title, text, label) {
  if (ended) return; ended = true; clearTimeout(retryT);
  $("#end-t").textContent = title; $("#end-p").textContent = text; $("#end-b").textContent = label; $("#end").hidden = false;
}
$("#end-b").addEventListener("click", () => location.reload());
DeskDotLogo.mount($("#j-logo"), { pitch: 6, grid: true });
DeskDotLogo.mount($("#end-logo"), { pitch: 4 });
function onHello(m) {
  const first = !S.hello; S.hello = true;
  S.seat = m.seat; S.game = m.game || "Casino";
  if (m.rulebook && typeof m.rulebook === "object") S.rulebook = m.rulebook;
  S.palette = Array.isArray(m.palette) ? m.palette : []; S.avatars = {}; S.avatarIds = [];
  for (const a of m.avatars || []) { S.avatars[a.id] = a; S.avatarIds.push(a.id); }
  if (typeof m.cid === "string" && m.cid !== cid) { cid = m.cid; store("deskdot.cid", cid); }
  const p = m.profile || {};
  S.me = { name: p.name || "P" + S.seat, color: m.color || p.color || "#ffcc33", avatar: p.avatar || S.avatarIds[0] };
  document.title = `${S.game} · DeskDot casino`;
  if (!m.resumed) {
    const saved = store("deskdot.profile") || {}, want = {};
    const nm = cleanName(saved.name).trim() || FUN[Math.floor(Math.random() * FUN.length)];
    if (nm !== S.me.name) { S.me.name = nm; want.name = nm; }
    if (saved.avatar && S.avatars[saved.avatar] && saved.avatar !== S.me.avatar) { S.me.avatar = saved.avatar; want.avatar = saved.avatar; }
    if (saved.color && S.palette.some((x) => x.color === saved.color) && saved.color !== S.me.color) want.color = saved.color;
    if (Object.keys(want).length) sendProfile(want, true);
  }
  send("seed", { client_seed: seed });
  let last = ""; try { last = sessionStorage.getItem("deskdot.casino.scr:" + code) || ""; } catch (_) {}
  if (first) { if (m.resumed || last === "table") { sendProfile({ ready: true }, true); go("table"); toast(`Welcome back, ${S.me.name}`); } else go("seat"); }
  else { toast("Reconnected"); if (S.screen === "table") sendProfile({ ready: true }, true); }
  Live.want(document.visibilityState !== "hidden"); // the live panel: frames from now on (this socket)
  paintMe();
}
function onRoster(players) {
  S.roster = Array.isArray(players) ? players : [];
  const mine = S.roster.find((p) => p.seat === S.seat);
  if (mine) { S.me.color = mine.color; if (document.activeElement !== $("#name") && !profQ.name) S.me.name = mine.name; S.me.avatar = mine.avatar || S.me.avatar; }
  if (S.screen === "seat") renderSeat(); else paintMe();
}
function connect() {
  if (ended) return;
  let sock;
  try { sock = new WebSocket(`${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/ws/p/${code}?cid=${encodeURIComponent(cid)}`); }
  catch (_) { retryT = setTimeout(connect, backoff); return; }
  ws = sock; sock.binaryType = "arraybuffer";
  sock.onopen = () => { backoff = 300; lastMsg = now(); net(true); S.lastSeq = 0; }; // acks are per socket
  sock.onmessage = (ev) => {
    if (sock !== ws) return; lastMsg = now(); net(true);
    if (typeof ev.data !== "string") { Live.frame(ev.data); return; } // the live panel (opted in after hello)
    let m; try { m = JSON.parse(ev.data); } catch (_) { return; }
    if (m.type === "hello") onHello(m);
    else if (m.type === "state") onState(m);
    else if (m.type === "pong" && typeof m.t === "number") SYNC.sample(m.server_time, m.t / 1000, now() / 1000); // the shared clock
    else if (m.type === "roster") onRoster(m.players);
    else if (m.type === "full") { end("The table is full", "Every seat is taken. Ask the host to make room, then scan the QR code on the panel again.", "Try again"); sock.close(); }
    else if (m.type === "closed") { end("The table closed", "The host closed this game. Your credits are kept — scan the QR code on the panel to join the next one.", "Rejoin"); sock.close(); }
    else if (m.type === "replaced") { end("Opened somewhere else", "This seat was opened in another tab or window, so this one stopped.", "Use this one"); sock.close(); }
  };
  sock.onclose = () => { if (sock !== ws || ended) return; net(false); retryT = setTimeout(connect, backoff); backoff = Math.min(Math.round(backoff * 1.6), 3000); };
}
setInterval(() => {
  if (ws && ws.readyState === 1) ws.send(JSON.stringify({ type: "ping", t: now() }));
  if (ws && ws.readyState === 1 && now() - lastMsg > 5000 && !ended) { const dead = ws; ws = null; try { dead.close(); } catch (_) {} net(false); clearTimeout(retryT); connect(); }
}, 1500);
document.addEventListener("visibilitychange", () => Live.want(document.visibilityState !== "hidden")); // no frames in the background
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && !ended && (!ws || ws.readyState > 1)) { clearTimeout(retryT); connect(); } });

/* ------------------------------------------------ boot */
$("#j-code").textContent = code.toUpperCase();
for (const s of $$(".scr")) s.inert = !s.classList.contains("on");
requestAnimationFrame(tickCountdown);
paintSound();
connect();
window.DeskDotCasino = { registerGame, Rng, sha256, hmac256, hex, ctx }; // for game modules added later and for tests
</script>
