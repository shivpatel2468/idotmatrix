name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  engine:
    name: Engine — tests & lint
    runs-on: windows-latest   # the platform DeskDot is verified on (WinRT Bluetooth)
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --extra mcp
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run pytest -q

  js:
    name: JS — node tests (tests/js)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # no npm install: the tests use only node built-ins; tv_menu.test.mjs skips itself without playwright-core
      - run: node --test "tests/js/*.test.mjs"

  android-resources:
    # A second, not a Gradle build: Android's XML must be well-formed ("--" inside a comment broke the 3.9.0 APK
    # build after it was tagged). scripts/release.py runs the same check before it tags.
    name: Android — XML resources are well-formed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check_android_res.py

  studio:
    name: Studio — typecheck & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
