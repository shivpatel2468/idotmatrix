name: Release

# Push a version tag (v3.8.0) → checks → the Windows installer and the macOS disk images → a DRAFT GitHub Release
# with checksums.txt and that version's notes from WHATS_NEW.md. `scripts/release.py` does all of it (docs/RELEASING.md):
# it adds the Android APK (built and signed on the owner's machine) and publishes the draft.
#
# Android in CI (optional): only when the owner has added ALL FOUR secrets ANDROID_KEYSTORE_B64,
# ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD (docs/RELEASING.md § Signing the APK on GitHub),
# the `android` job builds and signs the phone APK (and the watch APK once android/wear exists) and attaches them;
# release.py then skips its local build. Without them the job is skipped and nothing changes.
#
# Builds are unsigned unless these optional repository secrets exist (docs/DEPLOY.md § Code signing):
#   WINDOWS_CERT_PFX_BASE64 + WINDOWS_CERT_PASSWORD                       Authenticode (signtool)
#   MACOS_CERT_P12_BASE64 + MACOS_CERT_PASSWORD + MACOS_SIGN_IDENTITY     Developer ID Application
#   APPLE_ID + APPLE_TEAM_ID + APPLE_APP_PASSWORD                         notarization (needs the above)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build, e.g. v3.8.0"
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  checks:
    name: Checks (version, lint, fast tests)
    runs-on: windows-latest
    timeout-minutes: 30
    outputs:
      android_signing: ${{ steps.android.outputs.signing }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Tag matches the version in the code
        shell: bash
        run: |
          code=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' src/deskdot/__init__.py)
          [ "v$code" = "$TAG" ] || { echo "tag $TAG but src/deskdot/__init__.py says $code"; exit 1; }
          grep -q "^## $code " WHATS_NEW.md || { echo "WHATS_NEW.md has no '## $code' section"; exit 1; }
      - name: Android XML is well-formed
        run: python scripts/check_android_res.py
      - name: Can GitHub sign the Android APK? (all four ANDROID_* secrets present)
        id: android
        shell: bash
        env:
          A: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          B: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          C: ${{ secrets.ANDROID_KEY_ALIAS }}
          D: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$A" ] && [ -n "$B" ] && [ -n "$C" ] && [ -n "$D" ]; then echo "signing=yes" >> "$GITHUB_OUTPUT"
          else echo "signing=no" >> "$GITHUB_OUTPUT"; echo "No Android signing secrets: the APK is built on the owner's machine."; fi
      - run: uv sync --extra mcp
      - run: uv run ruff check src tests
      - run: uv run pytest -q tests/test_updates.py tests/test_desktop.py tests/test_protocol.py tests/test_api.py tests/test_launcher.py

  studio:
    name: Studio build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          if-no-files-found: error

  windows:
    name: Windows installer
    needs: [checks, studio]
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
      WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist
      - uses: astral-sh/setup-uv@v6
      - name: Inno Setup
        run: if (-not (Get-Command iscc -ErrorAction SilentlyContinue) -and -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup --no-progress -y }
      - name: PyInstaller
        run: powershell -ExecutionPolicy Bypass -File packaging\windows\build.ps1 -SkipStudio -SkipInstaller
      - name: Smoke test (the frozen engine answers /api/health)
        run: |
          $env:DESKDOT_HOME = "$env:RUNNER_TEMP\deskdot-home"
          $env:DESKDOT_UPDATE_CHECK = "0"
          $p = Start-Process packaging\build\dist\DeskDot\deskdot-cli.exe -ArgumentList "serve","--sim","--port","8799","--host","127.0.0.1" -PassThru
          $ok = $false
          foreach ($i in 1..60) { try { $r = Invoke-RestMethod http://127.0.0.1:8799/api/health; if ($r.ok) { $ok = $true; break } } catch {} ; Start-Sleep 1 }
          Stop-Process $p -Force
          if (-not $ok) { throw "the frozen engine didn't answer /api/health" }
          "health ok: $($r.version)"
      - name: Sign the programs (optional)
        if: env.WINDOWS_CERT_PFX_BASE64 != ''
        run: |
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\cert.pfx", [Convert]::FromBase64String($env:WINDOWS_CERT_PFX_BASE64))
          $signtool = (Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName | Select-Object -Last 1).FullName
          & $signtool sign /f "$env:RUNNER_TEMP\cert.pfx" /p $env:WINDOWS_CERT_PASSWORD /fd sha256 /tr http://timestamp.digicert.com /td sha256 `
            packaging\build\dist\DeskDot\DeskDot.exe packaging\build\dist\DeskDot\deskdot-cli.exe
      - name: Installer
        run: |
          $v = "${{ env.TAG }}".TrimStart("v")
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc "/DAppVersion=$v" packaging\windows\DeskDot.iss
          if ($LASTEXITCODE) { throw "iscc failed" }
      - name: Sign the installer (optional)
        if: env.WINDOWS_CERT_PFX_BASE64 != ''
        run: |
          $signtool = (Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName | Select-Object -Last 1).FullName
          & $signtool sign /f "$env:RUNNER_TEMP\cert.pfx" /p $env:WINDOWS_CERT_PASSWORD /fd sha256 /tr http://timestamp.digicert.com /td sha256 `
            (Get-ChildItem packaging\build\installer\*.exe).FullName
          Remove-Item "$env:RUNNER_TEMP\cert.pfx"
      - uses: actions/upload-artifact@v4
        with:
          name: installer-windows
          path: packaging/build/installer/*.exe
          if-no-files-found: error

  macos:
    name: macOS dmg (${{ matrix.arch }})
    needs: [checks, studio]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-latest, arch: arm64 }      # Apple silicon
          - { runner: macos-15-intel, arch: x64 }     # Intel Macs
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist
      - uses: astral-sh/setup-uv@v6
      - name: PyInstaller
        env:
          UV_PROJECT_ENVIRONMENT: packaging/build/venv
        run: |
          uv sync --frozen --no-dev --extra launcher --group packaging
          uv run --no-sync python packaging/prepare.py
          uv run --no-sync pyinstaller packaging/deskdot.spec --noconfirm --clean --distpath packaging/build/dist --workpath packaging/build/work
      - name: Smoke test (the frozen engine answers /api/health)
        run: |
          export DESKDOT_HOME="$RUNNER_TEMP/deskdot-home" DESKDOT_UPDATE_CHECK=0
          packaging/build/dist/DeskDot.app/Contents/MacOS/DeskDot serve --sim --port 8799 --host 127.0.0.1 &
          pid=$!
          for i in $(seq 1 60); do curl -fs http://127.0.0.1:8799/api/health && ok=1 && break; sleep 1; done
          kill $pid || true
          [ "${ok:-}" = 1 ] || { echo "the frozen engine didn't answer /api/health"; exit 1; }
      - name: Signing identity (optional)
        if: env.MACOS_CERT_P12_BASE64 != ''
        run: |
          KC="$RUNNER_TEMP/build.keychain-db"; KCPW="$(uuidgen)"
          security create-keychain -p "$KCPW" "$KC" && security set-keychain-settings -lut 21600 "$KC" && security unlock-keychain -p "$KCPW" "$KC"
          echo "$MACOS_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$MACOS_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KC"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KCPW" "$KC"
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          echo "MACOS_SIGN_IDENTITY=${{ secrets.MACOS_SIGN_IDENTITY }}" >> "$GITHUB_ENV"
          if [ -n "$APPLE_ID" ]; then
            xcrun notarytool store-credentials deskdot --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD"
            echo "MACOS_NOTARY_PROFILE=deskdot" >> "$GITHUB_ENV"
          fi
      - name: Disk image
        # build_dmg.sh retries hdiutil itself; Spotlight indexing the fresh files is the usual "Resource busy" cause,
        # so it's switched off first, and the whole script gets a second try with a pause.
        run: |
          sudo mdutil -a -i off >/dev/null 2>&1 || true
          for attempt in 1 2; do
            bash packaging/macos/build_dmg.sh "${TAG#v}" "${{ matrix.arch }}" && break
            [ "$attempt" = 2 ] && { echo "the disk image failed twice"; exit 1; }
            echo "disk image attempt $attempt failed; trying again in 30 s"; sleep 30
          done
      - uses: actions/upload-artifact@v4
        with:
          name: installer-macos-${{ matrix.arch }}
          path: packaging/build/installer/*.dmg
          if-no-files-found: error

  android:
    name: Android APK (signed on GitHub, optional)
    needs: [checks, studio]
    if: needs.checks.outputs.android_signing == 'yes'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-python@v5
        id: py
        with:
          python-version: "3.13"   # Chaquopy compiles the app's Python with it
      - name: SDK and signing (the keystore exists only for this job)
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" >/dev/null
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          echo "deskdot.buildPython=${{ steps.py.outputs.python-path }}" >> android/local.properties
          echo "$ANDROID_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
          } > android/keystore.properties
      - name: Build (phone, and the watch when android/wear exists)
        working-directory: android
        run: |
          chmod +x gradlew
          tasks=":app:assembleRelease"
          [ -f wear/build.gradle.kts ] && tasks="$tasks :wear:assembleRelease"
          ./gradlew --no-daemon $tasks
      - name: Signed with the release key? (else phones refuse the update)
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          v="${TAG#v}"
          mkdir -p out
          cp "android/app/build/outputs/apk/release/DeskDot-$v.apk" out/
          if [ -f android/wear/build.gradle.kts ]; then
            cp "$(ls android/wear/build/outputs/apk/release/*.apk | tail -n 1)" "out/DeskDot-Wear-$v.apk"
          fi
          want=$(keytool -list -v -keystore "$RUNNER_TEMP/release.jks" -alias "$ANDROID_KEY_ALIAS" -storepass:env ANDROID_KEYSTORE_PASSWORD | sed -n 's/.*SHA256: *//p' | head -n 1 | tr -d ':' | tr 'A-F' 'a-f')
          for apk in out/*.apk; do
            got=$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$apk" | sed -n 's/.*SHA-256 digest: *//p' | head -n 1)
            [ -n "$want" ] && [ "$got" = "$want" ] || { echo "$apk isn't signed with the release key"; exit 1; }
            echo "$apk: signed with the release key"
          done
      - name: Forget the key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks" android/keystore.properties
      - uses: actions/upload-artifact@v4
        with:
          name: installer-android
          path: out/*.apk
          if-no-files-found: error

  release:
    name: Draft GitHub Release
    needs: [windows, macos, android]
    # the android job is skipped without its secrets; the release still goes ahead (the APK comes from release.py)
    if: ${{ !cancelled() && needs.windows.result == 'success' && needs.macos.result == 'success' && needs.android.result != 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          path: out
          merge-multiple: true
      - name: Checksums
        working-directory: out
        run: sha256sum * > checksums.txt && cat checksums.txt
      - name: Release notes from WHATS_NEW.md
        run: |
          v="${TAG#v}"
          awk -v v="$v" '$0 ~ "^## "v" " {on=1; next} on && /^## / {exit} on {print}' WHATS_NEW.md > notes.md
          cat >> notes.md <<EOF

          ---

          ### Download

          | Your device | File |
          | --- | --- |
          | Windows 10 / 11 (64-bit) | \`DeskDot-Setup-$v-x64.exe\` |
          | Mac with Apple silicon (M1 and newer) | \`DeskDot-$v-macOS-arm64.dmg\` |
          | Mac with an Intel chip | \`DeskDot-$v-macOS-x64.dmg\` |
          | Android phone (8.0+) | \`DeskDot-$v.apk\` |
          EOF
          if [ -f "out/DeskDot-Wear-$v.apk" ]; then
            echo "| Wear OS watch (with the phone app) | \`DeskDot-Wear-$v.apk\` |" >> notes.md
          fi
          cat >> notes.md <<EOF

          Already using DeskDot 3.8 or newer? Settings → Device → Updates installs this version for you.
          First time: the [download steps](https://github.com/${{ github.repository }}#-download) explain the
          "unknown publisher" warnings. \`checksums.txt\` has the SHA-256 of every file.
          EOF
          cat notes.md
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 && gh release upload "$TAG" out/* --clobber || \
          gh release create "$TAG" out/* --draft --title "DeskDot ${TAG#v}" --notes-file notes.md --verify-tag
