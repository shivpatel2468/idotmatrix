# idotmatrix.com — the DeskDot website. Plain static files: site/ is committed fully generated
# (scripts/build_site_media.py → build_site_data.py → build_site_pages.py), so Netlify runs no build.

[build]
  publish = "site"
  command = ""

# Old one-page anchors and the bare /apps folder land on the right page.
[[redirects]]
  from = "/apps"
  to = "/apps.html"
  status = 301
[[redirects]]
  from = "/apps/"
  to = "/apps.html"
  status = 301

# Anything else unknown → the styled 404 page (Netlify serves site/404.html automatically; kept explicit).
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

[[headers]]
  for = "/*"
  [headers.values]
    # The one inline script (marks <html class="js">) is allowed by its hash; build_site_pages.py prints it
    # (csp_hash()) and tests/test_site_data.py checks that this header still matches.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'sha256-wuQ05BGS4fB84zLslY2delBS6nRGEpjNY7Rcc8MBpKM='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://api.github.com; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

# Pages, CSS, JS and data: always revalidate (names don't change between deploys).
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"
[[headers]]
  for = "/apps.json"
  [headers.values]
    Cache-Control = "public, max-age=3600"
    Access-Control-Allow-Origin = "*"

# Media: a week in browsers, a day of stale-while-revalidate (previews are re-rendered between releases).
[[headers]]
  for = "/media/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"
[[headers]]
  for = "/favicon.*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
