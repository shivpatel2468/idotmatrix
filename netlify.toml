# idotmatrix.com — the DeskDot website. Plain static files: site/ is committed fully generated
# (scripts/build_site_media.py → build_site_data.py → build_site_pages.py), so Netlify runs no build.

[build]
  publish = "site"
  command = ""

# Old one-page anchors and the bare /apps folder land on the right page.
[[redirects]]
  from = "/apps"
  to = "/apps.html"
  status = 301
[[redirects]]
  from = "/apps/"
  to = "/apps.html"
  status = 301

# The web app lives at /app/ (its service worker's scope); the bare path lands there. Its live-data fallback
# (/app/proxy) is a Netlify Function (netlify/functions/cors-proxy.mjs) routed by its own `config.path`.
[[redirects]]
  from = "/app"
  to = "/app/"
  status = 301

# Friends join a game running in someone's browser tab: the QR code points at /p/<code>; the join page connects
# the phone to that tab over WebRTC (web/webapp/join/, signalling through netlify/functions/signal.mjs).
[[redirects]]
  from = "/p/*"
  to = "/app/join/index.html"
  status = 200

# The TV view (docs/TV_VIEW.md): a TV opens /tv/<code>; the same join page links it to the tab and shows tv.html.
[[redirects]]
  from = "/tv/*"
  to = "/app/join/index.html"
  status = 200

# Anything else unknown → the styled 404 page (Netlify serves site/404.html automatically; kept explicit).
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

# Security headers for everything (the website and the web app).
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "interest-cohort=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

# Content-Security-Policy for the website's pages. Kept off /app/* on purpose: Netlify combines matching rules, and
# two policies would both apply (the web app's needs wasm and the Pyodide CDN). The one inline script (marks
# <html class="js">) is allowed by its hash; build_site_pages.py prints it (csp_hash()) and
# tests/test_site_data.py checks that these headers still match.
[[headers]]
  for = "/"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'sha256-wuQ05BGS4fB84zLslY2delBS6nRGEpjNY7Rcc8MBpKM='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://api.github.com; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), display-capture=()"
[[headers]]
  for = "/:page"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'sha256-wuQ05BGS4fB84zLslY2delBS6nRGEpjNY7Rcc8MBpKM='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://api.github.com; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), display-capture=()"
[[headers]]
  for = "/apps/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'sha256-wuQ05BGS4fB84zLslY2delBS6nRGEpjNY7Rcc8MBpKM='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://api.github.com; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), display-capture=()"
[[headers]]
  for = "/media/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'sha256-wuQ05BGS4fB84zLslY2delBS6nRGEpjNY7Rcc8MBpKM='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://api.github.com; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), display-capture=()"

# The web app (docs/WEB_APP.md): Pyodide from the pinned jsDelivr CDN ('wasm-unsafe-eval' compiles its WebAssembly),
# the engine in a same-origin worker, and the apps' live-data APIs over https (the engine fetches them from the page).
[[headers]]
  for = "/app/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net 'wasm-unsafe-eval'; worker-src 'self'; connect-src 'self' https:; img-src 'self' data: blob: https:; media-src 'self' blob: mediastream:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
    # the web app asks (only when an app needs it): webcam, microphone, screen sharing, location for weather
    Permissions-Policy = "camera=(self), microphone=(self), display-capture=(self), geolocation=(self)"

# The phone join page (/p/<code> is rewritten to /app/join/; headers follow the requested path).
[[headers]]
  for = "/p/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net 'wasm-unsafe-eval'; worker-src 'self'; connect-src 'self' https:; img-src 'self' data: blob: https:; media-src 'self' blob: mediastream:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
    Permissions-Policy = "camera=(self), microphone=(self), display-capture=(self), geolocation=(self)"

# The TV view (/tv/<code>, rewritten to /app/join/ like /p/).
[[headers]]
  for = "/tv/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net 'wasm-unsafe-eval'; worker-src 'self'; connect-src 'self' https:; img-src 'self' data: blob: https:; media-src 'self' blob: mediastream:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
    Permissions-Policy = "camera=(self), microphone=(self), display-capture=(self), geolocation=(self)"

# Pages, CSS, JS and data: always revalidate (names don't change between deploys).
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"
[[headers]]
  for = "/apps.json"
  [headers.values]
    Cache-Control = "public, max-age=3600"
    Access-Control-Allow-Origin = "*"

# Media: a week in browsers, a day of stale-while-revalidate (previews are re-rendered between releases).
[[headers]]
  for = "/media/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"
[[headers]]
  for = "/favicon.*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
