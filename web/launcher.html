<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f0f13" />
    <script>
      (function () { // the studio theme (deskdot.theme: light | dark | system), before first paint — lib/theme.ts
        var p = "system";
        try { p = localStorage.getItem("deskdot.theme") || "system"; } catch (e) {}
        var t = p === "light" || p === "dark" ? p : (window.matchMedia && matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
        document.documentElement.setAttribute("data-theme", t);
        document.documentElement.style.colorScheme = t;
      })();
    </script>
    <link rel="icon" href="/favicon.svg" />
    <title>DeskDot Launcher</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/launcher/main.tsx"></script>
  </body>
</html>
