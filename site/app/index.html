<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#0c0c0f" />
    <!-- theme before first paint (no flash): localStorage deskdot.theme = light | dark | system (default) — see lib/theme.ts -->
    <script>
      (function () {
        var p = "system";
        try { p = localStorage.getItem("deskdot.theme") || "system"; } catch (e) {}
        var t = p === "light" || p === "dark" ? p : (window.matchMedia && matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
        var r = document.documentElement;
        r.setAttribute("data-theme", t);
        r.style.colorScheme = t;
        if (t === "light") document.querySelector('meta[name="theme-color"]').setAttribute("content", "#f4f0e8");
        try { // Liquid Glass before first paint (lib/glass.ts refines it): solid for reduced transparency; frosted (near
          // opaque, no blur) without backdrop-filter or inside the Android app, whose WebView let content show through
          var g = localStorage.getItem("deskdot.glass") || "auto", bl = window.CSS && (CSS.supports("backdrop-filter", "blur(1px)") || CSS.supports("-webkit-backdrop-filter", "blur(1px)"));
          var rt = window.matchMedia && matchMedia("(prefers-reduced-transparency: reduce)").matches;
          r.setAttribute("data-glass", rt || g === "solid" ? "solid" : g === "frosted" || !bl || (g !== "liquid" && window.DeskDotAndroid) ? "frosted" : "liquid");
        } catch (e) {}
        try { // the page theme (lib/pageTheme.ts) cached by the last visit: painted before the first frame
          var pt = localStorage.getItem("deskdot.pageTheme"), css = localStorage.getItem("deskdot.pageThemeCss");
          if (pt && pt !== "ember" && css) {
            var st = document.createElement("style"); st.id = "dd-page-theme"; st.textContent = css;
            document.head.appendChild(st); document.documentElement.setAttribute("data-page-theme", pt);
          }
        } catch (e) {}
      })();
    </script>
    <link rel="icon" href="/app/favicon.svg" />
    <title>DeskDot in your browser: unofficial studio for iDotMatrix panels</title>
    <meta name="description" content="The DeskDot studio for iDotMatrix-compatible 32×32 LED panels, in your browser over Web Bluetooth: the full studio and engine, no install (unofficial)." />
    <link rel="manifest" href="/app/manifest.webmanifest" />
    <script src="/app/host/host.js?v=b3d93e89d92f"></script>
    <script type="module" crossorigin src="/app/assets/studio-rrut2cGI.js"></script>
    <link rel="stylesheet" crossorigin href="/app/assets/studio-ChU3nHf7.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
