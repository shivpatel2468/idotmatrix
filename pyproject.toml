[project]
name = "deskdot"
version = "3.2.0"
description = "DeskDot — a real-time engine, studio and MCP bridge for the iDotMatrix 32x32 RGB LED panel."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "bleak>=1.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.28",
    "numpy>=2.1",
    "pillow>=11.0",
    "psutil>=6.1",
    "pydantic>=2.9",
    "python-multipart>=0.0.18",
    "syncedlyrics>=1.0.1",
    "winrt-Windows.Media.Control>=2.3; sys_platform == 'win32'",
    "winrt-Windows.Storage.Streams>=2.3; sys_platform == 'win32'",
    "winrt-Windows.Foundation>=2.3; sys_platform == 'win32'",
    "soundcard>=0.4.6",
    "opencv-python-headless>=4.10,<5",
    "pyobjc-framework-cocoa>=10 ; sys_platform == 'darwin'",
    "pyobjc-framework-quartz>=10 ; sys_platform == 'darwin'",
    "tzdata>=2026.4",
]

[project.optional-dependencies]
mcp = ["mcp>=1.2"]
launcher = [
    "pystray>=0.19",
    "pywebview>=5.3",
]

[project.scripts]
deskdot = "deskdot.cli:main"
deskdot-mcp = "deskdot.mcp_server:main"

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.8", "mypy>=1.13"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deskdot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003", "B008", "SIM105", "UP046"]

[tool.mypy]
python_version = "3.12"
strict_optional = true
ignore_missing_imports = true
